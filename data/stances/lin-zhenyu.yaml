    date: '2022-11-26'
    venue: 中央選舉委員會選舉公報
    quote: '全齡照護

      ●推動幸福喘息、增設長照、日照、居家服務補助及時數。'
    context: 公報第6頁（PDF 第2頁），號次13 林珍羽（推薦政黨：台灣民眾黨）的政見欄。2022-11-26 為投票日。
    timestamp: null
