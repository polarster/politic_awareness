- question: B_ELDERCARE
  value: 1
  interpretation: 公報政見主張增設長照、日照據點或擴大長者照顧與補助，判為增加。選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: bulletin
    title: 111年地方公職人員選舉 臺北市議員選舉公報：第4選舉區（中山、大同）
