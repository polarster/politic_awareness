- question: E01
  value: 1
  interpretation: 社民黨政綱批評稅制長期向富人與財團傾斜、不斷為富人減稅，主張改革稅制，並以共同分擔的財政建立普遍的社會安全網；但只見於 2016 年政綱，未見近年的具體稅改主張，故判為同意。
  last_reviewed: 2026-11-07
  evidence:
  - grade: C
    kind: platform
    title: 社會民主黨政綱：新經濟（舊版官網）
    url: https://old.sdp.org.tw/programs/1
    date: null
    venue: 社會民主黨官網政綱（2016 年網站存檔）
    quote: 長期以來，不論其政黨支持者的階級屬性為何，執政黨都與富人和財團形成官商共治的統治集團，不願以實價課稅等政策來抑制過度哄抬的房價，反而不斷為富人減稅，給予財團稅賦優惠。
    context: 政綱「新經濟」篇前言，並主張「當務之急是改革稅制與產業政策，並強化財產的社會責任」。 出處為社民黨舊版官網（old.sdp.org.tw）；新版官網（www.sdp.org.tw）尚未補齊黨綱內容。
    timestamp: null
