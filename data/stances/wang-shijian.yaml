- question: G01
  value: 0
  interpretation: 王世堅在 2025 年《核管法》延役修法的記名表決中投反對票；但 2026 年 3 月賴清德總統表示核三具備重啟條件後，他公開支持政策調整，並主張把「非核家園」改成「非碳家園」、政府應研究核能重啟並以安全為優先。2026 年 7 月他仍與民進黨團一致，反對國民黨團「廢除非核家園」公投提案逕付二讀（程序表決，對象是公投提案而非重啟本身）。較新的發言傾向支持研究重啟，較新的表決則反對國民黨的公投提案，整體立場混合，判為中立；2025
    年的反對票列為較早的立場。
  last_reviewed: 2026-11-07
  evidence:
  - grade: C
    kind: statement
    title: 重啟核電…王世堅：為台灣好都是對的 相信黨內會支持
    url: https://www.worldjournal.com/wj/story/121221/9403431
    date: '2026-03-26'
    venue: null
    quote: 只要政策調整是為台灣社會好，都是對的，相信總統做決定前已深思熟慮。
    context: 世界新聞網轉載報導：賴清德總統表示核三廠 2 號機及 3 號機「已具備重啟條件」，王世堅受訪時表態支持。
    timestamp: null
