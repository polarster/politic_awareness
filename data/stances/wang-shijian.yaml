- question: V03
  value: -1
  interpretation: 王世堅在 2025 年《環評法》第五條修正（把一定規模以上地面型、水面型太陽光電納入環評）的記名表決中投反對票，與民進黨團一致。這次修法只針對太陽光電，投票可能同時反映對光電開發的態度。王世堅本人沒有找到針對這題的公開發言，判斷只根據他和民進黨團一致的記名表決，因此只判為 ±1。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: vote
    title: 立法院第11屆第4會期第9次會議議事錄：環境影響評估法第五條修正記名表決
