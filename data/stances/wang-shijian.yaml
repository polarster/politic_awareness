    quote: null
    context: 記名表決結果附後(10)(11)：第五條及全案均為國民黨49、民眾黨8、無黨籍2 贊成，民進黨48 反對；王世堅兩次都投反對。表決紀錄取自 data/ly/votes.json（院會-11-4-9#10、#11）。
    timestamp: null
    vote:
      body: 立法院
      bill: 環境影響評估法第五條（民眾黨團、國民黨團共同所提再修正動議；將一定規模以上地面型、水面型太陽光電納入環評）
      choice: 反對
      ref: eia-solar-2025
- question: G02
  value: -2
  interpretation: 王世堅在 2024 年國會職權修法覆議案的記名投票中投「反對維持原決議」（即支持行政院覆議，要求推翻這套法案），刑法藐視國會罪覆議案也相同。題目問的正是是否支持 2024 年通過的這套法案，記名表決直接對應，判為非常不同意。（沒有找到他本人針對這題的公開發言。）
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: vote
    title: 立法院第11屆第1會期第19次會議議事錄：立法院職權行使法修正覆議案記名投票
    url: https://ppg.ly.gov.tw/ppg/publications/official-gazettes/113/64/01/details
    date: '2024-06-21'
    venue: 立法院院會
    quote: null
    context: 覆議案記名投票：贊成維持原決議 62 人（國民黨52、民眾黨8、無黨籍2），反對維持原決議 51 人（民進黨51）；王世堅投反對維持原決議。刑法第一百四十一條之一覆議案結果相同。表決紀錄取自 data/ly/votes.json（院會-11-1-19#1001、#1002）。
    timestamp: null
    vote:
      body: 立法院
      bill: 行政院對《立法院職權行使法》修正部分條文之覆議案（表決是否維持原決議）
      choice: 反對維持原決議
      ref: legislative-reform-override-2024
- question: B_CHILDCARE
  value: 1
  interpretation: 公報政見主張增設公立或公共化托育、幼兒園，判為增加。選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
