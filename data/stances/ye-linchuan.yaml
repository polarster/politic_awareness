stances:
- question: B_ELDERCARE
  value: 1
  interpretation: 公報政見主張增設長照、日照據點或擴大長者照顧與補助，判為增加。選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: bulletin
    title: 111年地方公職人員選舉 臺北市議員選舉公報：第4選舉區（中山、大同）
    url: https://eebulletin.cec.gov.tw/111/02%E8%87%BA%E5%8C%97%E5%B8%82/02%E5%B8%82%E8%AD%B0%E5%93%A1/%E8%87%BA%E5%8C%97%E5%B8%82%E7%AC%AC04%E9%81%B8%E8%88%89%E5%8D%80.pdf
    date: '2022-11-26'
    venue: 中央選舉委員會選舉公報
    quote: （一）守護長輩：爭取假牙、老花眼鏡及助聽器等各項補助。
    context: 公報第6頁（PDF 第2頁），號次9 葉林傳（推薦政黨：中國國民黨）的政見欄。2022-11-26 為投票日。
    timestamp: null
- question: B_TRANSIT
  value: 1
  interpretation: 公報政見主張推動或加速捷運路線、增設車站或擴充公車等大眾運輸，判為增加。選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: bulletin
    title: 111年地方公職人員選舉 臺北市議員選舉公報：第4選舉區（中山、大同）
    url: https://eebulletin.cec.gov.tw/111/02%E8%87%BA%E5%8C%97%E5%B8%82/02%E5%B8%82%E8%AD%B0%E5%93%A1/%E8%87%BA%E5%8C%97%E5%B8%82%E7%AC%AC04%E9%81%B8%E8%88%89%E5%8D%80.pdf
    date: '2022-11-26'
    venue: 中央選舉委員會選舉公報
    quote: '（六）民生汐止：加速推動並增設捷運民生西路、重慶北路站。

      （七）大圓環站：增設捷運圓環站，活絡圓環商圈。

      （八）社子輕軌：爭取民族西路輕軌站，延伸路網至臺北車站。'
    context: 公報第6頁（PDF 第2頁），號次9 葉林傳（推薦政黨：中國國民黨）的政見欄。2022-11-26 為投票日。
