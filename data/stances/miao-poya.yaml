  interpretation: >
    苗博雅 2018、2022 兩屆市議員選舉公報的政見分別以「堅持台灣主體 監督兩岸交流」「捍衛臺灣主權 民主良善治理」為標題；
    2018 年雙城論壇晚宴她穿著印有台獨字樣的服裝出席，表示兩方交朋友要「把對方當成獨立個體」。
    方向明確傾向台灣主體，但沒有找到她直接以「國與國」定位兩岸的表述（公報只有標題層級），因此判為同意而非非常同意。
