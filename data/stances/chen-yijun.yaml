stances:
- question: B_HOUSING
  value: 1
  interpretation: 公報政見主張增建社會住宅或調降社宅租金，都需要市府投入更多經費，判為增加。選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: bulletin
    title: 111年地方公職人員選舉 臺北市議員選舉公報：第4選舉區（中山、大同）
    url: https://eebulletin.cec.gov.tw/111/02%E8%87%BA%E5%8C%97%E5%B8%82/02%E5%B8%82%E8%AD%B0%E5%93%A1/%E8%87%BA%E5%8C%97%E5%B8%82%E7%AC%AC04%E9%81%B8%E8%88%89%E5%8D%80.pdf
    date: '2022-11-26'
    venue: 中央選舉委員會選舉公報
    quote: '三、【落實居住正義、台北好宜居。】

      1.監督市府利用閒置國有市有土地廣建社會住宅，提供民眾居住機會。'
    context: 公報第5頁（PDF 第1頁），號次1 陳怡君（推薦政黨：民主進步黨）的政見欄。2022-11-26 為投票日。
    timestamp: null
