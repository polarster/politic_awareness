- question: N01
  value: 1
  interpretation: >-
    蔣萬安多次表示承認九二共識的存在，並稱它是過去兩岸交流的基礎；但他一再強調自己認知的九二共識是「符合中華民國憲法」的版本，
    並堅決反對一國兩制。接受九二共識作為基礎、但附加中華民國憲法的前提，判為同意而非非常同意。
  last_reviewed: 2026-11-07
  evidence:
  - grade: C
    kind: statement
    title: 議員追問未來「蔣習會」? 蔣萬安反喊話賴清德要做這件事
    url: https://udn.com/news/story/6656/9433847
    date: 2026-04-10
    venue: 台北市議會
    quote: 他所認知的『九二共識』是符合中華民國憲法的九二共識，捍衛中華民國主權、恪遵中華民國憲法，以及守護台灣的民主自由法治。
    context: 聯合報報導，國民黨主席鄭麗文與習近平會面後，台北市長蔣萬安在議會被問及兩岸立場時的說法；報導並稱他表示「反對台獨」一直是國民黨的立場。
    timestamp: null
  - grade: C
    kind: statement
