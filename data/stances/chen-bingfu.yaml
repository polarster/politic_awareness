    date: '2022-11-26'
    venue: 中央選舉委員會選舉公報
    quote: '一、改善台北停車問題

      ・爭取於校園改建時增設地下停車場，創造更多停車空間。

      ・推動更新現有老舊立體停車場、增設新式機械停車場。'
    context: 公報第5頁（PDF 第1頁），號次5 陳炳甫（推薦政黨：中國國民黨）的政見欄。2022-11-26 為投票日。
