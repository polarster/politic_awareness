- question: B_ROADS
  value: 1
  interpretation: 公報政見主張增設或更新停車場、改善道路，判為增加。選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
