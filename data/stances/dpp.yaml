- question: L01
  value: 1
  interpretation: 2026 年民進黨立委林宜瑾等 19 人（多為民進黨籍）提案修正《國家情報工作法》，要求網路平台在得知服務被用於境外敵對勢力「認知作戰」（散布虛假或誤導性訊息）時，依情報機關告知採取限制瀏覽、移除內容等措施；2022 年 NCC《數位中介服務法》草案爭議時，民進黨立委也表示對假訊息「應該要有一些約束」。但該草案在爭議後暫緩，林宜瑾等人的提案只限於境外敵對勢力、並附有不得侵害人民權利的但書，且非黨團提案，故判為傾向同意。
