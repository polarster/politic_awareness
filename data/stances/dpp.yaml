- question: L02
  value: 1
  interpretation: '2024 年民進黨立委蔡易餘等人提案修正《通訊保障及監察法》，以「境外敵對勢力之威脅日增，為維護國家安全」為由，把《國家安全法》、《反滲透法》的部分罪名納入可聲請通訊監察的範圍，並把國家情報工作機關可直接向電信業者調取的資料擴及網路流量紀錄（行政院版內容相同，2024 年 7 月三讀）；2026 年林宜瑾等民進黨立委又提案讓情報機關可要求網路平台提供數據與演算法參數，以反制認知作戰。方向一致支持擴大國安監控權限；但兩案都是個別立委提案、非黨團提案，新增罪名的監聽仍須法院核發通訊監察書，情工法草案也附有不得侵害人民權利的但書，故判為傾向同意。（檢警為偵辦一般犯罪調取網路流量紀錄的修法屬於治安題 S04 的範圍，不列為本題證據。）

    '
