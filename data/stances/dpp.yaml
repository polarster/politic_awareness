- question: N02
  value: 2
  interpretation: '民進黨《台灣前途決議文》（黨章規定效力等同黨綱）主張台灣是主權獨立國家、與中華人民共和國互不隸屬；賴清德總統多次重申「台灣已是主權獨立國家」「中華民國與中華人民共和國互不隸屬」，民進黨政府的內政部長也在立法院表示外國國籍包含中華人民共和國。雖然官方較少直接使用「國與國」一詞（陸委會主委在立法院被問到是否主張「一邊一國」時，以「互不隸屬」回答），但立場實質上等同兩岸為兩個互不隸屬的國家，判為非常同意。

    '
  last_reviewed: 2026-11-07
