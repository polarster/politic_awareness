entity: gao-shijun
stances:
- question: B_ROADS
  value: 1
  interpretation: 公報政見主張增加停車場、提升道路品質，判為增加。（同一項政見也主張調降停車費率，屬於收入面，本 App 沒有對應的預算項目。）選舉公報政見通常只列要增加的項目，不會說明經費來源或要減少哪些項目，因此只能判斷方向（+1），無法判斷取捨。
  last_reviewed: 2026-11-07
  evidence:
  - grade: A
    kind: bulletin
    title: 111年地方公職人員選舉 臺北市議員選舉公報：第4選舉區（中山、大同）
    url: https://eebulletin.cec.gov.tw/111/02%E8%87%BA%E5%8C%97%E5%B8%82/02%E5%B8%82%E8%AD%B0%E5%93%A1/%E8%87%BA%E5%8C%97%E5%B8%82%E7%AC%AC04%E9%81%B8%E8%88%89%E5%8D%80.pdf
    date: '2022-11-26'
    venue: 中央選舉委員會選舉公報
    quote: '停車費用 重新改革：調降費率與收費範圍、增加電子收費折扣、方便停車。

      圓山花博 再現風華：改造廢墟舊天文館等、增加停車場，大圓山再發光。

      道路品質 向上提昇：從用路人、行人、身障者的使用角度出發，通行順暢。'
    context: 公報第5頁（PDF 第1頁），號次2 高世俊（推薦政黨：中國國民黨）的政見欄。2022-11-26 為投票日。
