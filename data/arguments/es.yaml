arguments:
  - question: E01
    pro:
      text: "支持者認為，經濟成長的果實愈來愈集中在少數資本擁有者，受薪階級卻承受物價上漲壓力。適度提高對高所得、高資產者或大企業的稅負，例如調高遺產稅率或研議富人稅，並把財源用在長照等社會福利，能縮小貧富差距、落實分配正義，幫助較弱勢的人。"
      sources:
        - kind: gazette
          title: "立法院第9屆第3會期財政委員會第5次全體委員會議紀錄 公報 委員吳秉叡發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/106/27/LCIDC01_1062701_00011.pdf"
          date: "2017-03-15"
          speaker: "吳秉叡"
        - kind: news
          title: "AI 紅利如何全民共享？賴士葆提案課5%富人稅（聯合報）"
          url: "https://udn.com/news/story/7238/9660597"
          date: "2026-07-30"
          speaker: "賴士葆"
    con:
      text: "反對者認為，降稅是國際趨勢，美國等國都在降稅，台灣若調高營所稅與股利稅負，會增加企業負擔、影響在台投資意願。對富人加稅也未必可行：調高綜所稅最高稅率會加重高薪受雇者負擔，大幅調高遺贈稅恐增加規避誘因，應改為擴大稅基。"
      sources:
        - kind: news
          title: "稅改過關 工商團體批稅高的不合理（ETtoday）"
          url: "https://finance.ettoday.net/news/1096512"
          date: "2018-01-19"
          speaker: "林伯豐、蔡練生"
        - kind: news
          title: "政策失當 縮貧富差距 專家：應檢討稅制（聯合報）"
          url: "https://udn.com/news/story/7238/9661870"
          date: "2026-07-31"
        - kind: gazette
          title: "立法院第9屆第3會期財政委員會第5次全體委員會議紀錄 公報 財政部長許虞哲報告（對大幅調高遺贈稅版本的意見）"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/106/27/LCIDC01_1062701_00011.pdf"
          date: "2017-03-15"
          speaker: "許虞哲"
  - question: E02
    pro:
      text: "支持者認為，物價年年上漲，最低工資若沒有跟著調整，基層勞工的實質所得就會縮水，難以維持基本生活。勞資雙方談判力量並不對等，應以法律明定最低工資不得低於前一年、並反映物價漲幅，讓調整有穩定依據，保障勞工及其家庭的生活。"
      sources:
        - kind: gazette
          title: "立法院第10屆第8會期社會福利及衛生環境委員會第5次全體委員會議紀錄 公報 委員林為洲、王婉諭發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/112/72/LCIDC01_1127202_00002.pdf"
          date: "2023-10-18"
          speaker: "林為洲、王婉諭"
        - kind: official
          title: "最低工資連11漲！審議會決定自116年1月1日起，每月最低工資調升至30,900元（勞動部新聞稿）"
          url: "https://www.mol.gov.tw/1607/1632/1633/99195/"
          date: "2026-09-24"
    con:
      text: "反對者認為，最低工資應依整體經濟、產業景氣與企業負擔能力彈性調整，不宜用法律規定固定公式或每年必漲。在關稅衝擊、成本上升時，傳統產業與中小企業壓力很大，強制調漲可能影響企業營運彈性與投資意願，最後也不利於產業競爭力。"
      sources:
        - kind: gazette
          title: "立法院第10屆第8會期社會福利及衛生環境委員會第5次全體委員會議紀錄 公報 勞動部長許銘春說明、經濟部書面報告"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/112/72/LCIDC01_1127202_00002.pdf"
          date: "2023-10-18"
          speaker: "許銘春"
        - kind: news
          title: "最低工資調漲 工商團體籲政府盡速提配套方案（中央社）"
          url: "https://www.cna.com.tw/news/afe/202509260262.aspx"
          date: "2025-09-26"
  - question: E03
    pro:
      text: "支持者認為，過多、過嚴或解釋不一的法規，會讓企業申請流程冗長、成本升高，壓抑投資與創新。政府主動檢討不合時宜的函釋與行政規則，提高程序透明與可預期性，能排除投資障礙，讓企業更有彈性因應市場變化，提升整體競爭力。"
      sources:
        - kind: official
          title: "賴揆：積極推動法規鬆綁 建立彈性、高效能行政文化（行政院新聞稿）"
          url: "https://www.ey.gov.tw/Page/9277F759E41CCD91/b321ee62-3764-4c1a-9103-3cfb7bb8444e"
          date: "2018-05-17"
          speaker: "賴清德"
        - kind: news
          title: "日本工商會白皮書首發問卷揭3大痛點 國發會拋雙軸轉型3點正面回應（優分析）"
          url: "https://uanalyze.com.tw/articles/3033056663"
          date: "2026-10-07"
    con:
      text: "反對者認為，管制是保護消費者、勞工與環境的重要防線。食安等事件顯示，過度仰賴業者自主管理容易流於書面形式，等到出事才補救，代價由全民承擔。政府應落實稽查與把關，而不是一味鬆綁；企業經營的自由，應建立在對公共安全負責的前提上。"
      sources:
        - kind: gazette
          title: "立法院第11屆第5會期社會福利及衛生環境委員會第20次全體委員會議紀錄 公報 委員林淑芬發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/65/LCIDC01_1156501_00003.pdf"
          date: "2026-07-22"
          speaker: "林淑芬"
        - kind: news
          title: "致癌沙拉油風暴「上游驗合格、下游驗超標」 綠委：食用油業者管理制度已失靈？（聯合報）"
          url: "https://udn.com/news/story/6656/9603147"
          date: "2026-07-02"
  - question: E04
    pro:
      text: "支持者認為，公共照顧要服務的正是買不起照顧的人，品質要普及、價格要可近；若有錢的自己買、沒錢的自求多福，照顧就會走回家庭化、付費化。少子女化對策過度仰賴育兒津貼等現金補助，占比達八到九成，生育率卻不升反降。"
      sources:
        - kind: gazette
          title: "立法院第11屆第5會期社會福利及衛生環境委員會第3次全體委員會議紀錄 公報 委員林淑芬發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/23/LCIDC01_1152301_00006.pdf"
          date: "2026-03-26"
          speaker: "林淑芬"
        - kind: news
          title: "立院預算中心：搶救少子化過度仰賴現金補助 成效欠佳（聯合報）"
          url: "https://udn.com/news/story/6656/9521948"
          date: "2026-05-24"
    con:
      text: "反對者認為，育兒津貼在德國、日本等國已有實證，能有效減輕育兒負擔，朝野也都提出每月五千元的津貼方案。家庭狀況不同，有人送托、有人自行照顧，應讓津貼與托育服務雙軌並行、由家長依需求選擇，而非以政府直接提供為主。"
      sources:
        - kind: news
          title: "賴總統提0至18歲每月領5千「兒少成長津貼」 衛福部曝初步規畫不排富（聯合報）"
          url: "https://udn.com/news/story/124881/9515316"
          date: "2026-05-20"
        - kind: news
          title: "賴總統推0至18歲成長津貼 國民黨許宇甄欣慰：從善如流（聯合報）"
          url: "https://udn.com/news/story/124881/9514537"
          date: "2026-05-20"
          speaker: "許宇甄"
        - kind: official
          title: "政府提供「津貼補助」及「托育服務」的多元支持措施，協助家庭關照孩子的托育需求（衛生福利部新聞稿）"
          url: "https://mohw.gov.tw/cp-16-22234-1.html"
          date: "2014-03-04"
  - question: E05
    pro:
      text: "支持者認為，政府資源有限，福利若不分貧富一律發放，補助效果會被稀釋，也加重財政負擔。把資源集中給真正有需要的家庭，例如排除所得最高的一部分家庭，再把省下的經費加倍用於中低收入者，較能縮小差距，也符合公共政策照顧弱勢的原則。"
      sources:
        - kind: gazette
          title: "立法院第11屆第5會期社會福利及衛生環境委員會「臺灣未來帳戶特別條例草案」公聽會紀錄 公報 中華兒童暨家庭守護者協會執行長周明湧發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/24/LCIDC01_1152401_00004.pdf"
          date: "2026-04-02"
          speaker: "周明湧"
        - kind: news
          title: "朝野選前競開支票未排富 學者憂增財政負擔（聯合報）"
          url: "https://udn.com/news/story/6656/9678339"
          date: "2026-08-08"
    con:
      text: "反對者認為，「每個孩子都很重要」，家庭支持應是穩定、普及且具延續性的制度，而不是只給部分家庭。育兒津貼取消排富後，所有家庭都能享有政策照顧，原本因所得被排除的上萬名幼兒也能受益，展現「國家一起養」的決心。"
      sources:
        - kind: news
          title: "賴總統提0至18歲每月領5千「兒少成長津貼」 衛福部曝初步規畫不排富（聯合報）"
          url: "https://udn.com/news/story/124881/9515316"
          date: "2026-05-20"
          speaker: "張美美"
        - kind: official
          title: "強化0-2歲幼兒照顧體系 不排富全照顧 挺專業顧品質（衛生福利部新聞稿）"
          url: "https://mohw.gov.tw/cp-16-72135-1.html"
          date: "2022-10-27"
  - question: S01
    pro:
      text: "支持者認為，校園裡本來就有不同性傾向與性別認同的學生，也有同志家庭的孩子。教材若刻意迴避，會讓這些孩子感到被忽視，也不利於減少歧視。依課綱在不同學習階段適齡地介紹多元性別，能幫助學生認識並尊重彼此的差異。"
      sources:
        - kind: gazette
          title: "立法院第11屆第2會期教育及文化委員會「因應數位時代，啟動性別平等教育2.0」公聽會紀錄 公報 台灣同志諮詢熱線協會副秘書長彭治鏐發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/07/LCIDC01_1140704_00009.pdf"
          date: "2024-12-23"
          speaker: "彭治鏐"
        - kind: news
          title: "幸福盟批同志教育「換湯不換藥」教育部：絕對適齡（新頭殼）"
          url: "https://newtalk.tw/news/view/2019-03-29/226591"
          date: "2019-03-29"
    con:
      text: "反對者認為，課程應遵守課綱的適齡原則，小一孩子應先認識不同性別者的身心異同，不宜太早接觸同性婚姻內容，否則會影響孩子對未來婚姻家庭的看法。教育部也應遵守公投結果，不讓同志教育進入國中小，並尊重家長的意見。"
      sources:
        - kind: news
          title: "小一發同婚繪本 家長團體、挺同團體大論戰（公視）"
          url: "https://news.pts.org.tw/article/493339"
          date: "2020-09-09"
          speaker: "全國家長會長聯盟、下一代幸福聯盟、曾獻瑩"
  - question: S02
    pro:
      text: "支持者認為，死刑的嚇阻作用難以確知，為缺乏實證的嚇阻效果剝奪生命並不合乎比例，長期監禁已足以防衛社會。國家不該以應報之名行報復之實，死刑反而讓國家疏於追究犯罪成因與照顧被害人，任何人都沒有資格結束他人的生命。"
      sources:
        - kind: news
          title: "死刑釋憲案 律師：任何人都沒資格結束他人生命（中央社）"
          url: "https://www.cna.com.tw/news/asoc/202404230170.aspx"
          date: "2024-04-23"
          speaker: "李念祖、李宣毅（死刑釋憲案聲請人訴訟代理人）"
    con:
      text: "反對者認為，對手段兇殘、罪證確鑿的重大犯罪，死刑是實現社會公平正義、回應被害人家屬的必要手段，民調也顯示多數民眾反對廢除。判決門檻若嚴格到幾乎無法判處，等於讓死刑名存實亡；國家應優先保護無辜者，讓難以教化的人與社會隔絕。"
      sources:
        - kind: gazette
          title: "立法院第11屆第3會期第6次會議紀錄 公報 委員林沛祥、陳菁徽發言"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/114/28/LCIDC01_1142801_00003.pdf"
          date: "2025-03-21"
          speaker: "林沛祥、陳菁徽"
        - kind: news
          title: "「反廢死」聲浪再起 黃國昌喊話立院排審無期徒刑不得假釋（聯合報）"
          url: "https://udn.com/news/story/6656/9217225"
          date: "2025-12-21"
          speaker: "黃國昌"
  - question: S03
    pro:
      text: "支持者認為，人口老化與少子化讓許多產業與家庭照顧面臨缺工；優秀移工技術成熟後卻因工作年限限制必須返國，常被他國挖角。讓資深移工轉任中階技術人力、不受工作年限限制並銜接永久居留，能留住熟手、降低人力斷層。"
      sources:
        - kind: official
          title: "勞動部與工業區廠商舉辦「移工留才久用方案」座談會（勞動部新聞稿）"
          url: "https://www.mol.gov.tw/1607/1632/1640/57257/"
          speaker: "許銘春"
        - kind: official
          title: "留才中心協助國內科技大廠 留用優質外國技術人力！（勞動部新聞稿）"
          url: "https://www.mol.gov.tw/1607/1632/1633/83432/"
          date: "2025-09-16"
    con:
      text: "反對者認為，在勞動力供不應求、勞工議價能力終於有機會提升時，持續擴大依賴外籍勞動力，只是幫雇主省錢，扼殺本國勞工爭取加薪與改善工作條件的機會；有更便宜的人力，企業也不願錄用中高齡者。缺工應靠提高薪資與勞動條件來解決。"
      sources:
        - kind: news
          title: "缺工擴大引進移工！全產總反對 專家憂加劇低薪、排擠中高齡就業（NOWnews）"
          url: "https://www.nownews.com/news/6282538"
          date: "2023-10-17"
          speaker: "江健興、花梓馨"
  - question: S04
    pro:
      text: "支持者認為，詐騙、跨境與科技犯罪手法不斷翻新，警察與檢調若缺乏足夠的偵查工具與法律授權，就難以有效打擊犯罪、保護民眾的財產與安全。在法律明確授權、並有法院審查等配套下，適度擴大執法權限，有助於維護治安。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期司法及法制委員會第30次全體委員會議紀錄 公報 委員沈發惠發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/56/LCIDC01_1135601_00006.pdf"
          date: "2024-06-05"
          speaker: "沈發惠"
        - kind: news
          title: "憂《科技偵查法》侵害隱私 立委籲輕罪不適用避免浮濫調閱（公視）"
          url: "https://news.pts.org.tw/article/698747"
          date: "2024-06-06"
    con:
      text: "反對者認為，讓檢警植入木馬程式監控通訊軟體，等於授權政府帶頭當駭客侵入人民資訊，讓憲法與通保法淪為廢紙，台灣恐倒退回警察國家。若只要「必要」就能定位監控，沒有罪名限制、也沒有法院審查，只顧偵查方便，人權與隱私都會受侵害。"
      sources:
        - kind: news
          title: "擬立法授權檢警監聽通訊軟體 引發隱私疑慮（公視）"
          url: "https://news.pts.org.tw/article/494107"
          date: "2020-09-16"
          speaker: "林永頌、林建宏"
  - question: S05
    pro:
      text: "支持者認為，有父有母的婚姻家庭是孩子成長最穩定的環境，政府資源應優先用於鼓勵適齡結婚、生育，而不是擴大單身或同性伴侶使用人工生殖等做法。這類政策涉及兒童權益，社會也還沒有共識，應審慎推動並尊重多數民意。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期社會福利及衛生環境委員會「人工生殖法條文修正草案」公聽會紀錄 公報 社團法人台灣全國媽媽護家護兒聯盟書面資料"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/24/LCIDC01_1132401_00005.pdf"
          date: "2024-04-03"
        - kind: news
          title: "《人工生殖法》擬納同志、單身 民團網路調查逾7成民眾反對（公視）"
          url: "https://news.pts.org.tw/article/678600"
          date: "2024-01-29"
    con:
      text: "反對者認為，現代家庭型態愈來愈多元，包括單親、同志伴侶與單身家庭，政府應平等支持每一種家庭，而不是只優先某一種形式。讓單身女性與女同志伴侶也能使用人工生殖等政策，是尊重生育自主，也能兼顧兒童最佳利益。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期社會福利及衛生環境委員會「人工生殖法條文修正草案」公聽會紀錄 公報 委員范雲發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/24/LCIDC01_1132401_00005.pdf"
          date: "2024-04-03"
          speaker: "范雲"
        - kind: news
          title: "人工生殖法草案修訂擬脫鉤代理孕母 女女同婚適用（聯合報）"
          url: "https://udn.com/news/story/7266/9194795"
          date: "2025-12-10"
  - question: S06
    pro:
      text: "支持者認為，近年課程淡化傳統經典與四維八德等德目，學生缺少系統性的倫理教育，校園師生關係緊張、青少年犯罪問題也引發關注。讓四維八德等傳統德目回到品德教育的核心，能幫助學生建立是非觀念，兼顧權利與責任。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期教育及文化委員會「高級中等教育修法暨108課綱實施檢討」公聽會紀錄 公報 段心儀發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/52/LCIDC01_1135201_00002.pdf"
          date: "2024-05-30"
          speaker: "段心儀"
        - kind: news
          title: "108課綱去中國化、狂刪文言文 北一女師轟「無恥與不倫」 教育部回應了（台灣英文新聞）"
          url: "https://www.taiwannews.com.tw/zh/news/5055321"
          date: "2023-12-08"
    con:
      text: "反對者認為，品德不是靠背誦教條或特定德目就能養成，而應在生活實踐與討論中培養。現行課綱並未廢除禮義廉恥，而是強調讓學生學會表達、溝通與思辨，在生活中實踐尊重與責任；教育應與時俱進，而不是回到過去背誦中心德目的方式。"
      sources:
        - kind: news
          title: "任內最困難工作潘文忠這麼說 品德教育「不是讓孩子背教條」（聯合報）"
          url: "https://udn.com/news/story/6885/7950601"
          date: "2024-05-08"
          speaker: "潘文忠"
