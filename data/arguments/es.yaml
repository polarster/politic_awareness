  - question: S06
    pro:
      text: "支持者認為，近年課程淡化傳統經典與四維八德等德目，學生缺少系統性的倫理教育，校園師生關係緊張、青少年犯罪問題也引發關注。加強傳統倫理與品德教育，能幫助學生建立是非觀念與責任感，培養尊重他人的態度。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期教育及文化委員會「高級中等教育修法暨108課綱實施檢討」公聽會紀錄 公報 段心儀發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/52/LCIDC01_1135201_00002.pdf"
          date: "2024-05-30"
          speaker: "段心儀"
        - kind: news
          title: "108課綱去中國化、狂刪文言文 北一女師轟「無恥與不倫」 教育部回應了（台灣英文新聞）"
          url: "https://www.taiwannews.com.tw/zh/news/5055321"
          date: "2023-12-08"
    con:
      text: "反對者認為，品德不是靠背誦教條或特定德目就能養成，而應在生活實踐與討論中培養。現行課綱並未廢除禮義廉恥，而是強調讓學生學會表達、溝通與思辨，在生活中實踐尊重與責任；教育應與時俱進，而不是回到過去背誦中心德目的方式。"
      sources:
