arguments:
  - question: N01
    pro:
      text: "支持者認為，2008年起的八年間，兩岸在九二共識、反對台獨的基礎上對話交流、維持和平，證明這條路可行。2016年後對岸以台灣未承認九二共識為由中斷兩會對話，至今未恢復；政府若接受九二共識，兩岸就能重啟對話、避免衝突。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 海基會董事長吳豊山報告（佐證對話中斷經過）"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "吳豊山"
        - kind: news
          title: "台灣不能涉險 鄭麗文：盼大陸不要軍事相向 民進黨政府接受九二共識（聯合報）"
          url: "https://udn.com/news/story/6656/9237119"
          date: "2025-12-31"
          speaker: "鄭麗文"
    con:
      text: "反對者認為，對岸已把九二共識定義為「兩岸同屬一中、共謀國家統一」，並與「一國兩制」連結，在這個框架下沒有中華民國存在的空間；以它作為對話前提，等於先在主權上讓步。多數民意也不接受，對話應在對等尊嚴、不設政治前提下進行。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 陸委會主委邱垂正答詢"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "邱垂正"
        - kind: news
          title: "民進黨提名參選總統 賴清德：台灣無統獨問題 民主是最大共識【全文】（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202304125004.aspx"
          date: "2023-04-12"
          speaker: "賴清德"
  - question: N02
    pro:
      text: "支持者認為，台灣有人民、土地、政府與主權，有自己的護照，關稅也自己跟美國談，中華人民共和國從未統治過台灣一天；台灣已是主權獨立國家，與對岸互不隸屬，對岸當然是外國。否則就等於承認台灣是中國的一部分。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 委員張宏陸質詢、陸委會主委邱垂正答詢"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "張宏陸、邱垂正"
        - kind: news
          title: "國民黨質疑「中華人民共和國是外國嗎？」時代力量：中共從未統治台灣任何一天，當然是外國！（時代力量新聞稿）"
          url: "https://newpowerparty.tw/archives/28903"
          date: "2026-05-18"
        - kind: news
          title: "劉世芳稱「中國是外國」 國民黨痛批踐踏憲法、偷渡兩國論要求下台（新頭殼）"
          url: "https://newtalk.tw/news/view/2025-11-24/1006300"
          date: "2025-11-24"
          speaker: "劉世芳"
    con:
      text: "反對者認為，依憲法增修條文與兩岸人民關係條例，兩岸是「國家尚未統一前的特殊關係」，同屬一個中國，大陸不是外國，宜以「互不承認主權、互不否認治權」描述。把兩岸說成國與國，是偷渡兩國論、製造事端，讓台灣陷入更大風險。"
      sources:
        - kind: news
          title: "賴清德談「台獨」兩岸互不隸屬 國民黨：同屬一中、大陸非外國（ETtoday）"
          url: "https://www.ettoday.net/news/20260517/3167486.htm"
          date: "2026-05-17"
        - kind: news
          title: "劉世芳稱「中國是外國」 國民黨痛批踐踏憲法、偷渡兩國論要求下台（新頭殼）"
          url: "https://newtalk.tw/news/view/2025-11-24/1006300"
          date: "2025-11-24"
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 委員賴士葆質詢"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "賴士葆"
  - question: N03
    pro:
      text: "支持者認為，中華民國憲法增修條文仍以「國家統一前」為前提，兩岸語言文化相近。若能以和平交流、協商談判的方式逐步走向統一，可從根本降低戰爭風險、擴大合作空間；台灣也應主動參與談判、爭取有利條件，而不是被動等待。"
      sources:
        - kind: official
          title: "中華民國憲法增修條文（全國法規資料庫）"
          url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0000002"
          date: "2005-06-10"
        - kind: news
          title: "台灣生存戰略 新黨：直面未來 主動重啟談判（聯合報）"
          url: "https://udn.com/news/story/6656/9465946"
          date: "2026-04-27"
          speaker: "李勝峯"
    con:
      text: "反對者認為，絕大多數民眾反對統一，也不接受一國兩制，民主才是台灣社會最大的共識，中華民國台灣的前途只有2300萬人可以決定。台灣應守護民主自由的現狀、保持現有的民主生活模式，而不是朝與中國統一的方向發展。"
      sources:
        - kind: news
          title: "民進黨提名參選總統 賴清德：台灣無統獨問題 民主是最大共識【全文】（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202304125004.aspx"
          date: "2023-04-12"
          speaker: "賴清德"
        - kind: news
          title: "「反對與中國統一！」黃國昌：我仍列中國黑名單、與北京無聯繫（NOWnews）"
          url: "https://www.nownews.com/news/6719364"
          date: "2025-08-14"
          speaker: "黃國昌"
  - question: N04
    pro:
      text: "支持者認為，中國大陸市場對台灣太重要，不能放棄；應盡快就ECFA與對岸溝通，重啟服貿、貨貿協商，確保台商權益，並大量開放陸客觀光。近年兩岸經貿與觀光往來降溫，陸客不來，老街與觀光相關產業受創，恢復往來有助地方經濟。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 委員徐欣瑩發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "徐欣瑩"
        - kind: news
          title: "侯友宜主張大量開放陸生陸客 當選重啟溝通ECFA服貿（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202311270276.aspx"
          date: "2023-11-27"
          speaker: "侯友宜"
    con:
      text: "反對者認為，中國常把經貿手段當作政治施壓與統戰工具，以優惠措施吸引台灣企業、人才與資金，加深台灣對單一市場的依賴；一旦遭到經濟脅迫，風險很高。與其擴大依賴，不如分散市場、強化與其他國家的經貿合作。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 大陸委員會業務報告"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "邱垂正"
        - kind: news
          title: "跨世代／反對與中簽和平協議、服貿 賴清德憂得不償失籲信賴台灣（NOWnews）"
          url: "https://www.nownews.com/news/6301580"
          date: "2023-11-15"
          speaker: "賴清德"
  - question: D01
    pro:
      text: "支持者認為，中國對台威脅與日俱增，持續實戰化演練，周邊國家都在提高國防預算，台灣也不能例外。國防預算已按北約標準超過GDP 3%，2030年前達到5%，能展現守護國家的決心、與國際共同發揮威懾力量；投資國防就是投資和平。"
      sources:
        - kind: news
          title: "國慶演說 總統：民主台灣是2300萬人在世界最明確定位【全文】（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202510100066.aspx"
          date: "2025-10-10"
          speaker: "賴清德"
        - kind: news
          title: "賴清德宣示國防預算2030前達GDP 5% 在野批排擠民生社福（世界日報）"
          url: "https://www.worldjournal.com/wj/story/121220/8957910"
          date: "2025-08-23"
          speaker: "賴清德、吳思瑤"
        - kind: news
          title: "鄭麗文反對增加國防預算 府酸：跟全世界民主國家不同（TVBS）"
          url: "https://news.tvbs.com.tw/politics/3029734"
          date: "2025-10-29"
          speaker: "郭雅慧"
    con:
      text: "反對者認為，台灣需要合理的國防，但過高的國防預算超出財政負擔能力，台灣不是提款機，國防也不是空白支票，不應陷入不斷升高的軍備競賽。短時間內把國防預算膨脹到GDP 5%，配套恐怕跟不上，也可能排擠民生與社福預算。"
      sources:
        - kind: news
          title: "鄭麗文反對增加國防預算 府酸：跟全世界民主國家不同（TVBS）"
          url: "https://news.tvbs.com.tw/politics/3029734"
          date: "2025-10-29"
          speaker: "鄭麗文"
        - kind: news
          title: "接受法新社專訪 鄭麗文：台灣非提款機 美國期望超出合理（世界日報）"
          url: "https://www.worldjournal.com/wj/amp/story/121475/9111820"
          date: "2025-11-01"
          speaker: "鄭麗文"
        - kind: news
          title: "賴清德宣示國防預算2030前達GDP 5% 在野批排擠民生社福（世界日報）"
          url: "https://www.worldjournal.com/wj/story/121220/8957910"
          date: "2025-08-23"
          speaker: "李彥秀、林憶君"
  - question: D02
    pro:
      text: "支持者認為，過去4個月的軍事訓練役時間太短，難以練成合格戰力；恢復一年役期可加強實戰化的射擊與戰鬥訓練，讓義務役擔任守備任務、補充兵力。在中國軍事威脅升高下，這能強化整體防衛能力與嚇阻力。"
      sources:
        - kind: gazette
          title: "立法院第10屆第7會期外交及國防委員會第3次全體委員會議紀錄 公報 國防部長邱國正答詢"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/112/25/LCIDC01_1122501_00001.pdf"
          date: "2023-03-06"
          speaker: "邱國正"
        - kind: news
          title: "義務役2024年起恢復為1年薪資2.6萬 總統：困難決定但無可迴避【全文】（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202212275006.aspx"
          date: "2022-12-27"
          speaker: "蔡英文"
    con:
      text: "反對者認為，現代戰爭靠科技與知識，需要「小而精」的部隊，兵貴精不在量；台灣是海島防禦，兵員多寡不像陸地戰場那麼關鍵。延長徵兵是背離募兵轉型、走回大量充員兵的舊路，還可能引發軍備競賽，升高衝突風險。"
      sources:
        - kind: news
          title: "陳宗逸觀點：延長義務役為一年，就可以解決國防困境？（風傳媒）"
          url: "https://www.storm.mg/article/4675822"
          date: "2022-12-29"
          speaker: "陳宗逸（台灣新故鄉智庫協會副秘書長）"
        - kind: news
          title: "【專家之眼】義務役延長為一年，年輕人欣然接受？（聯合報）"
          url: "https://udn.com/news/story/10930/6872546"
          date: "2022-12-29"
          speaker: "高永光（考試院前副院長）"
      note: "反方採用智庫幹部與學者的評論專文，兩篇都發表於 2022 年 12 月政府宣布恢復一年期義務役之後。"
  - question: D03
    pro:
      text: "支持者認為，中國的軍事擴張不只威脅台灣，也威脅日本、菲律賓等鄰國，日本已把中國軍事擴張視為最大戰略挑戰。台灣與美國、日本有共同的安全利益與民主價值，優先深化安全合作，可提升嚇阻力，共同維護台海與區域的和平穩定。"
      sources:
        - kind: gazette
          title: "立法院第11屆第5會期外交及國防委員會第18次全體委員會議紀錄 公報 委員林楚茵發言、國安局長蔡明彥答詢"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/44/LCIDC01_1154401_00001.pdf"
          date: "2026-05-25"
          speaker: "林楚茵、蔡明彥"
        - kind: news
          title: "賴總統：美日峰會後重申維護台海和平 展現國際社會對區域安全的重視（聯合報）"
          url: "https://udn.com/news/story/6656/9400385"
          date: "2026-03-24"
          speaker: "賴清德"
    con:
      text: "反對者認為，國際關係很現實，沒有永遠的朋友，只有利益；美國總統會以美國利益為優先，今天對台灣友善，明天可能就在美中談判中把台灣當籌碼，晶片、農產品等議題都可能重談。台灣必須預作因應，不能把大國的友好視為理所當然。"
      sources:
        - kind: gazette
          title: "立法院第11屆第5會期外交及國防委員會第18次全體委員會議紀錄 公報 委員黃建賓發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/44/LCIDC01_1154401_00001.pdf"
          date: "2026-05-25"
          speaker: "黃建賓"
  - question: D04
    pro:
      text: "支持者認為，兩岸官方對話中斷多年，誤判與擦槍走火的風險升高，而陸委會、海基會設立的目的就是對話與交流。與其堅持表述而讓溝通停擺，不如在政治表述上保持彈性、先恢復制度化對話，才能處理人身安全、觀光等實際問題，降低戰爭風險。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 委員謝龍介發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "謝龍介"
        - kind: news
          title: "台灣不能涉險 鄭麗文：盼大陸不要軍事相向 民進黨政府接受九二共識（聯合報）"
          url: "https://udn.com/news/story/6656/9237119"
          date: "2025-12-31"
          speaker: "鄭麗文"
    con:
      text: "反對者認為，對岸恢復官方對話的前提是接受其「一個中國原則」，等於要台灣先承認自己的國家不存在；在主權上讓步，未必能換來和平與安全。台灣願意在對等尊嚴、不設政治前提下對話，但不應以犧牲主權作為代價。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期內政委員會第10次全體委員會議紀錄 公報 委員蘇巧慧發言、陸委會主委邱垂正答詢"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/96/LCIDC01_1149601_00004.pdf"
          date: "2025-11-12"
          speaker: "蘇巧慧、邱垂正"
        - kind: news
          title: "鄭麗文籲賴清德接受九二共識 民進黨：對等尊嚴、願與中交流（公視）"
          url: "https://news.pts.org.tw/article/787966"
          date: "2025-12-28"
  - question: D05
    pro:
      text: "支持者認為，美中對抗的局勢已經形成，台灣不應成為大國競爭下的棋子，更不應成為衝突與對抗的戰場。台灣真正的價值，是在美中之間扮演理解、溝通與合作的橋梁，而不是選邊站；美中若能和平共存，對台灣也有利。"
      sources:
        - kind: news
          title: "鄭麗文：國民黨與美合作沒問題 台灣不在美中選邊（聯合報）"
          url: "https://udn.com/news/story/6656/9549142"
          date: "2026-06-06"
          speaker: "鄭麗文"
        - kind: news
          title: "盼台灣成為美中溝通橋樑 柯文哲曝參選理由：不希望台灣是兵凶戰危之地（風傳媒／中央社）"
          url: "https://www.storm.mg/article/4838514"
          date: "2023-07-21"
          speaker: "柯文哲"
    con:
      text: "反對者認為，威脅台海和平的是中國的軍事壓力，而不是台灣的選擇；美國與理念相近國家是台灣安全與經濟的重要夥伴，穩定的美中關係與強健的台美關係並不衝突。台灣本就站在自由民主一方，與民主夥伴合作才能共同維護台海現狀。"
