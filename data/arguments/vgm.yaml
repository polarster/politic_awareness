    con:
      text: "反對者認為，參與式預算每年投入不少經費與行政人力，實際成效卻有限，部分提案流於形式，或成案後因執行問題喊卡，也缺乏專責監督機制。議員也質疑參與式預算衝擊代議政治，預算本應由民選議會審議把關，擴大實施恐讓權責不清。"
