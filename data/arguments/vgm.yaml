  - question: M10
    pro:
      text: "支持者認為，參與式預算讓市民實際參與公共資源的分配，從提案、討論到投票，能喚起公民意識、共同關心社區事務，市政府也能從市民的角度解決生活中的大小問題，提高施政品質與滿意度。擴大參與，有助於深化民主與開放政府。"
      sources:
        - kind: official
          title: "臺北市參與式預算住民大會參與者及錄案案件性別分析報告（臺北市政府民政局）"
          url: "https://www-ws.gov.taipei/001/Upload/334/relfile/15936/134653/9d818cf0-c423-4a22-a6d1-fa9bffd883af.pdf"
          date: "2024-08-08"
        - kind: news
          title: "參與式預算SOP出爐 效率嚇到柯文哲（風傳媒）"
          url: "https://www.storm.mg/article/56559"
          date: "2015-07-08"
    con:
      text: "反對者認為，參與式預算每年投入不少經費與行政人力，實際成效卻有限，部分提案流於形式，或成案後因執行問題喊卡，也缺乏專責的監督機制。預算本應由民選議會審議把關，擴大參與式預算可能繞過代議機制，讓權責不夠清楚。"
