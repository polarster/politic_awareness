arguments:
  - question: V01
    pro:
      text: "支持者認為，國際供應鏈的減碳要求日益嚴格，再生能源已成為產業出口的剛性需求，減碳能力關係到未來訂單與競爭力，台灣必須加速發展多元綠能。電價也應反映真實成本，壓低電價等於補貼化石燃料，反而不利節能與淨零轉型。"
      sources:
        - kind: gazette
          title: "立法院第11屆第2會期第6次會議紀錄 公報 行政院長卓榮泰「能源配比及電價政策」專案報告"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/113/84/LCIDC01_1138401_00010.pdf"
          date: "2024-10-29"
          speaker: "卓榮泰"
        - kind: news
          title: "賴總統：再生能源裝置容量達25GW 10年增幅逾4倍（中央社）"
          url: "https://cna.com.tw/news/aipl/202610140091.aspx"
          date: "2026-10-14"
          speaker: "賴清德"
        - kind: news
          title: "國民黨提調漲電價要立法院同意 環團籲政治不該凌駕專業（公視）"
          url: "https://news.pts.org.tw/article/693362"
          date: "2024-05-03"
          speaker: "趙家緯、劉仲恩"
    con:
      text: "反對者認為，再生能源成本較高又有間歇性，政府以高價購買綠電，加上停用較便宜的電源，使台電虧損擴大，最後以調漲電價或預算撥補由全民買單，衝擊民生與產業競爭力。能源政策應以穩定、平價供電為優先，不宜為衝綠能比例而讓電價持續上漲。"
      sources:
        - kind: gazette
          title: "立法院第11屆第2會期第6次會議紀錄 公報 委員張啓楷質詢"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/113/84/LCIDC01_1138401_00010.pdf"
          date: "2024-10-29"
          speaker: "張啓楷"
        - kind: news
          title: "黃國昌指「綠友友吃飽」 民進黨：核電議題不應散布謠言（新頭殼）"
          url: "https://newtalk.tw/news/view/2025-08-13/987566"
          date: "2025-08-13"
          speaker: "黃國昌"
  - question: V02
    pro:
      text: "支持者認為，碳費是讓排放者為污染付出代價的工具，費率太低、優惠太多時，大企業可能選擇繳費了事而不真正減碳。逐步提高碳費，並把收入用於協助轉型與照顧受影響的弱勢群體，能更有效推動減碳，也與國際「先低後高」的碳定價做法一致。"
      sources:
        - kind: gazette
          title: "立法院第11屆第5會期社會福利及衛生環境委員會「《氣候變遷因應法》碳費徵收、減量誘因及溫室氣體管理基金運用制度」公聽會紀錄 公報 林彥廷研究員、委員王育敏發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/72/LCIDC01_1157202_00001.pdf"
          date: "2026-08-12"
          speaker: "林彥廷、王育敏"
        - kind: news
          title: "碳費拍板！一般費率每公噸300元 A、B優惠方案為50和100元（ETtoday）"
          url: "https://www.ettoday.net/news/20241007/2830698.htm"
          date: "2024-10-07"
    con:
      text: "反對者認為，台灣的碳費費率已明顯高於日本、韓國等出口競爭國的實質碳價，對製造業是額外成本；在電價、工資同時上漲之下，恐削弱國際競爭力。碳費應先低後高、不高於競爭對手，並給產業足夠的轉型時間。"
      sources:
        - kind: gazette
          title: "立法院第11屆第2會期經濟委員會第7次全體委員會議紀錄 公報 委員張嘉郡、呂玉玲發言"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/87/LCIDC01_1138702_00001.pdf"
          date: "2024-10-23"
          speaker: "張嘉郡、呂玉玲"
        - kind: news
          title: "碳費費率出爐 經部：方案未獲採納 遺憾但持續爭取（工商時報）"
          url: "https://www.ctee.com.tw/news/20241008700054-430104"
          date: "2024-10-08"
  - question: V03
    pro:
      text: "支持者認為，大型開發一旦破壞山林、水域或地質敏感區就難以回復。近年部分光電案場設在山坡地、水庫等敏感地點卻不必環評，引發生態與用水安全疑慮。擴大並加嚴環評範圍，讓審查結論具有實質拘束力，才能事前把關，減少日後的衝突與訴訟。"
      sources:
        - kind: gazette
          title: "立法院第11屆第4會期第9次會議紀錄 公報 委員陳昭姿發言（環境影響評估法第五條修正草案）"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/114/94/LCIDC01_1149401_00007.pdf"
          date: "2025-11-14"
          speaker: "陳昭姿"
        - kind: news
          title: "環評總體檢出爐 籲老舊環評應有完整退場機制（聯合報）"
          url: "https://udn.com/news/story/7266/9634861"
          date: "2026-07-17"
    con:
      text: "反對者認為，台灣光電推動已落後國際，加嚴環評勢必讓光電發展受影響，地面型光電納管後約要多花一到兩年，延後綠能與減碳進度。光電衝突的核心在於缺乏國土治理與土地規畫，而非環評制度不足；以面積門檻加嚴環評也缺乏科學基礎。"
      sources:
        - kind: news
          title: "修法加嚴環評、限縮開發面積範圍，能否解決光電不當選址問題？（報導者）"
          url: "https://www.twreporter.org/a/more-stringent-environmental-impact-assessments-to-build-solar-facilities"
          date: "2025-12-03"
          speaker: "彭啟明、吳志偉、王素芬"
  - question: V04
    pro:
      text: "支持者認為，AI是台灣難得的發展機遇，而AI與半導體帶動用電成長，先進製程未來還可能再增加用電，電力必須及時跟上。台灣土地小，燃氣機組占地小、興建時間短，全球要快速提供電力也都選擇燃氣機組，因此短期內新增電源應以燃氣為主，先解燃眉之急。"
      sources:
        - kind: news
          title: "全球救急供電倚重燃氣 台電董：台灣幾乎跟全球一致（自由時報）"
          url: "https://ec.ltn.com.tw/article/breakingnews/5549797"
          date: "2026-08-23"
          speaker: "曾文生"
    con:
      text: "反對者認為，天然氣仍是化石燃料，部分液化天然氣的溫室氣體密集度堪比燃煤，新建燃氣設施將長期排碳。台灣95%能源仰賴進口，天然氣昂貴，極端情況下存量僅撐約11天，仰賴海運就是國安破口。再生能源才是自產能源，應加快發展，提升能源自主與韌性。"
      sources:
        - kind: news
          title: "台灣仰賴燃氣作為過渡能源 德專家：錯誤論述（聯合報）"
          url: "https://udn.com/news/story/124649/9150833"
          date: "2025-11-20"
          speaker: "霍恩（新氣候研究所創辦人）"
        - kind: org
          title: "再生能源即國防盔甲：化解能源危機的燃「煤」之急（綠色和平，天下獨立評論專欄）"
          url: "https://www.greenpeace.org/taiwan/update/47136/再生能源是台灣能源安全的關鍵：化解能源危機/"
          date: "2026-05-05"
          speaker: "張皪心（綠色和平氣候與能源專案主任）"
        - kind: news
          title: "非核後7成用電靠火力 當低碳成為全球供應鏈門檻 台灣能源下一步？（公視）"
          url: "https://news.pts.org.tw/article/762309"
          date: "2025-07-24"
          speaker: "崔愫欣"
  - question: G01
    pro:
      text: "支持者認為，核電是穩定、低碳且發電成本較低的電源。面對AI產業帶動的用電成長與淨零目標，延役或重啟既有核電廠，可以分散能源風險、減少火力發電帶來的碳排與空污，並減輕電價上漲壓力；國際上也有不少國家重新重視核能。"
      sources:
        - kind: gazette
          title: "立法院第11屆第3會期第11次會議紀錄 公報 委員葛如鈞、劉書彬發言（核子反應器設施管制法第六條修正草案）"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/114/44/LCIDC01_1144405_00001.pdf"
          date: "2025-05-13"
          speaker: "葛如鈞、劉書彬"
        - kind: news
          title: "鄭麗文台中為議員站台 批中央能源政策籲挺重啟核電（中央社）"
          url: "https://cna.com.tw/news/aipl/202610110097.aspx"
          date: "2026-10-11"
          speaker: "鄭麗文"
    con:
      text: "反對者認為，台灣地震頻繁、人口密集，核三廠鄰近恆春斷層，老舊機組也曾發生輻射外洩、火災等事故，重啟的安全與成本都不確定。台灣至今沒有核廢料最終處置場，不應把風險留給下一代；應投資多元、分散的再生能源，提升能源韌性。"
      sources:
        - kind: gazette
          title: "立法院第11屆第3會期第11次會議紀錄 公報 委員賴瑞隆發言（核子反應器設施管制法第六條修正草案）"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/114/44/LCIDC01_1144405_00001.pdf"
          date: "2025-05-13"
          speaker: "賴瑞隆"
        - kind: news
          title: "核三公投／低碳安全？風險留後代？ 5場發表會交鋒一次看（公視）"
          url: "https://news.pts.org.tw/article/766123"
          date: "2025-08-18"
          speaker: "林子倫、甘崇緯、吳亞昕（公投反方）"
  - question: G02
    pro:
      text: "支持者認為，英、美、德、日等民主國家國會都有調查制度，釋字第585號也肯定立法院有固有的調查權，台灣卻只有調閱權。這次修法建立聽證調查制度，追究在國會說謊、提供不實資料的官員，能追查交代不清的弊案、還原真相。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期第1次全院委員會紀錄 公報 委員徐欣瑩發言（行政院覆議案）"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/60/LCIDC01_1136001_00004.pdf"
          date: "2024-06-19"
          speaker: "徐欣瑩"
        - kind: news
          title: "藍白再勝！立院否決行政院覆議案 黃國昌大讚：台灣民主歷史時刻（NOWnews）"
          url: "https://www.nownews.com/news/6454203"
          date: "2024-06-21"
          speaker: "黃國昌"
        - kind: news
          title: "憲法法庭判「國會改革案大部分違憲」 藍委怒：大法官該廢了（TVBS）"
          url: "https://news.tvbs.com.tw/politics/2664287"
          date: "2024-10-26"
          speaker: "許宇甄"
    con:
      text: "反對者認為，這套法案假改革之名行擴權之實，讓立法院可以把人移送法院，等於自己當檢察官；一般人民、團體被要求到立法院接受詢問，也會承受極大壓力，侵害基本權利與權力分立。憲法法庭後來判決法案大部分違憲。"
      sources:
        - kind: gazette
          title: "立法院第11屆第1會期第1次全院委員會紀錄 公報 委員李柏毅發言、行政院長卓榮泰答詢（行政院覆議案）"
          url: "https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/60/LCIDC01_1136001_00004.pdf"
          date: "2024-06-19"
          speaker: "李柏毅、卓榮泰"
        - kind: news
          title: "憲法法庭判「國會改革案大部分違憲」 藍委怒：大法官該廢了（TVBS）"
          url: "https://news.tvbs.com.tw/politics/2664287"
          date: "2024-10-26"
  - question: M07
    pro:
      text: "支持者認為，部分地主長年等待開發，政府若突然把可開發的土地改回保護區，地價下跌卻無人補償，人民對政府的信賴也落空，應依信賴保護原則保留坡地開發的可能。也有居民認為房子快不夠住，應放寬開發條件，地方有開發才會進步。"
      sources:
        - kind: news
          title: "陽明山開發看法兩極 地主籲信賴保護（聯合報）"
          url: "https://udn.com/news/story/7314/9665172"
          date: "2026-08-02"
    con:
      text: "反對者認為，山坡地地質脆弱、生態敏感，在極端降雨愈來愈頻繁的情況下，放寬開發會提高坍方與災害風險，威脅居住安全與自然景觀。台北人口已呈負成長，不必再往山坡地擴張；台北市政府也已規劃把多處「保變住」地區回復為保護區。"
      sources:
        - kind: news
          title: "山限區建物高度鬆綁遭反對 北市府將納討論（中央社）"
          url: "https://www.cna.com.tw/news/aloc/202305060199.aspx"
          date: "2023-05-06"
        - kind: news
          title: "北市19「保變住」政策翻轉 將回復為保護區（聯合報）"
          url: "https://udn.com/news/story/7314/9665171"
          date: "2026-08-02"
  - question: M08
    pro:
      text: "支持者認為，雙城論壇是兩岸之間持續至今唯一的官方對話平台，兩市可就科技、水治理、職業培訓等市政議題交流、簽署備忘錄。「接觸」比「牴觸」好，「對話」比「對抗」好，持續交流能增進了解，讓台灣海峽走向和平與繁榮。"
      sources:
        - kind: news
          title: "上海雙城論壇 蔣萬安致詞：願台海非波濤呼嘯而是和平繁榮（中央社）"
          url: "https://www.cna.com.tw/news/acn/202512280102.aspx"
          date: "2025-12-28"
          speaker: "蔣萬安"
        - kind: news
          title: "雙城論壇12/27、28上海登場 蔣萬安：聚焦科技與水治理（公視）"
          url: "https://news.pts.org.tw/article/785483"
          date: "2025-12-11"
          speaker: "蔣萬安"
        - kind: official
          title: "赴上海市參加「2023臺北上海城市論壇暨市政參訪活動」交流計畫書（臺北市政府，內政部移民署公開）"
          url: "https://www.immigration.gov.tw/media/97895/20230829臺北市市長蔣萬安赴陸計畫及行程.pdf"
          date: "2023-08-29"
    con:
      text: "反對者認為，雙城論壇舉辦多年，上海方出席人員常位階不對等或並非合適人選，論壇標榜的互相尊重、互相了解並未實現，共機擾台也沒有減少。既然論壇對台北市政的效益極低，沒有效益的事情就不需要再辦。"
      sources:
        - kind: news
          title: "蔣萬安擬赴上海參加雙城論壇 民進黨議員全數缺席（公視）"
          url: "https://news.pts.org.tw/article/770340"
          date: "2025-09-12"
          speaker: "顏若芳"
        - kind: news
          title: "沈伯洋主張停辦雙城論壇 陸委會：對岸不用急著批評（世界日報）"
          url: "https://www.worldjournal.com/wj/story/121475/9518476"
          date: "2026-05-21"
          speaker: "沈伯洋"
  - question: M09
    pro:
      text: "支持者認為，雙北本來就是共同生活圈，交通建設、捷運、河川治理、垃圾處理等議題都需要兩市共同治理；淡北道路、捷運中和光復線施工與淡水河、基隆河整治，都要兩市一起處理。兩市共治才能共榮，把雙北升級為30分鐘生活圈。"
      sources:
        - kind: news
          title: "時事焦點／拋5方針強化新北醫療量能 李四川：雙北升級30分鐘生活圈（鏡週刊）"
          url: "https://www.mirrormedia.mg/story/20260709inv001"
          date: "2026-07-09"
          speaker: "李四川"
        - kind: news
          title: "蘇巧慧不認同雙北共治 李四川：她跟沈伯洋一樣不瞭解（新頭殼）"
          url: "https://newtalk.tw/news/view/2026-07-06/1045512"
          date: "2026-07-06"
          speaker: "李四川"
    con:
      text: "反對者認為，雙北是共同生活圈，能合作當然很好，但城市之間也要競爭，就像兩家餐廳各有大廚與菜單，市民才有更多選擇；兩市不能失去主體性。食安、勞安等基礎架構守住共同標準、互相學習合作即可，「共好共榮」和共治不同。"
      sources:
        - kind: news
          title: "專訪／蘇巧慧：雙北要共榮 但也要各自精采（聯合報）"
          url: "https://udn.com/news/story/124652/9608969"
          date: "2026-07-06"
          speaker: "蘇巧慧"
  - question: M10
    pro:
      text: "支持者認為，參與式預算讓市民實際參與公共資源的分配，從提案、討論到投票，能喚起公民意識、共同關心社區事務，市政府也能從市民的角度解決生活中的大小問題，提高施政品質與滿意度。擴大參與，有助於深化民主與開放政府。"
      sources:
        - kind: official
