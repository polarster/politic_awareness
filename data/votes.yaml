# 精選的立法院記名表決：和問卷題目相關、或被用作立場證據的表決。
# vote 對應 data/ly/votes.json 的 id（由 scripts/ly_votes.py 從立法院議事錄產生）。
# scored: true 表示被用作政黨立場的 A 級證據；false 表示相關但未用於計分（note 說明原因）。
version: 1
votes:
  - id: defense-special-act-2026
    vote: "院會-11-5-9#3"
    also: ["院會-11-5-9#5"]
    title: 國防特別條例：特別預算上限改為 7800 億元
    summary: >
      行政院提出 8 年 1.25 兆元的國防特別條例。院會表決時，第五條（預算上限）改採國民黨團與民眾黨團共同提出的版本，
      上限為 7800 億元。這一票決定的是特別預算的規模，不是直接表決國防預算占 GDP 的比例。
    questions: [D01]
    scored: true

  - id: nuclear-act-2025
    vote: "院會-11-3-11#10"
    also: ["院會-11-3-11#9"]
    title: 核管法修正：核電廠可申請延役
    summary: >
      修正《核子反應器設施管制法》第六條，讓核電廠運轉執照可以申請延長，為延役或重啟核電開路。
      國民黨團與民眾黨團共同提出修正動議。
    questions: [G01]
    scored: true

  - id: non-nuclear-referendum-2026
    vote: "院會-11-5-17#12"
    title: 「廢除非核家園」公投提案（逕付二讀）
    summary: >
      國民黨團提出公投案：「您是否同意政府廢除『非核家園』的能源政策……？」這一票是程序表決，
      決定這個公投提案是否不經委員會審查、直接進入院會討論。
    questions: [G01]
    scored: true

  - id: death-penalty-referendum-2025
    vote: "院會-11-3-12#2"
    title: 「死刑不須一致決」公投提案
    summary: >
      憲法法庭判決要求死刑判決須由合議庭法官一致同意。國民黨團提出公投案，詢問民眾是否同意「判處死刑不須一致決」，
      院會表決通過這個提案（之後中選會駁回）。
    questions: [S02]
    scored: true

  - id: eia-solar-2025
    vote: "院會-11-4-9#11"
    also: ["院會-11-4-9#10"]
    title: 環評法修正：大型太陽光電納入環評
    summary: >
      修正《環境影響評估法》第五條，把一定規模以上的地面型、水面型太陽光電納入環評。
      這次修法只針對太陽光電，投票可能同時反映各黨對光電開發的態度。
    questions: [V03]
    scored: true

  - id: legislative-reform-override-2024
    vote: "院會-11-1-19#1001"
    also: ["院會-11-1-19#1002"]
    title: 國會改革法案覆議案
    summary: >
      立法院通過國會改革法案（包含調查權、聽證權）後，行政院認為窒礙難行，提出覆議。
      立法院以記名投票表決是否維持原決議。「贊成」代表贊成維持原決議，也就是反對行政院的覆議。
    questions: [G02]
    scored: true

  - id: house-tax-2023
    vote: "院會-10-8-12#48"
    title: 房屋稅條例修正（囤房稅 2.0）
    summary: >
      修正《房屋稅條例》，提高多戶持有者的房屋稅率（俗稱囤房稅 2.0），地方政府可在較高的稅率範圍內自訂稅率。
      表決的是第五條（稅率）採民進黨團修正動議。
    questions: [R_HOUSE_TAX]
    scored: true

  - id: climate-act-carbon-fee-2023
    vote: "院會-10-6-15#5"
    title: 氣候變遷因應法：碳費條文（第二十八條）
    summary: >
      《溫室氣體減量及管理法》修正為《氣候變遷因應法》，第二十八條規定對排碳大戶徵收碳費，採民進黨團修正動議。
    questions: [V02]
    scored: false
    note: >
      議事錄沒有記載國民黨團反對、民眾黨團棄權的理由，無法判斷是反對碳費本身，還是對條文內容有不同主張，
      所以這筆表決沒有用來判斷政黨立場，只列出供參考。
