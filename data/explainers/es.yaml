# 名詞與背景、正反說法的白話說明（經濟與福利、社會價值）
# 規則：中立；不提政黨與政治人物名字；plain 不加入原說法以外的事實或論點。
explainers:
  - question: E01
    terms:
      - term: 遺產稅
        text: "人過世後，對其留下的財產課徵的稅。台灣現行採三級累進：課稅遺產淨額5,000萬元以下課10%，5,000萬至1億元的部分課15%，超過1億元的部分課20%。"
        sources:
          - kind: official
            title: "遺產及贈與稅法 第13條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072"
      - term: 富人稅
        text: "泛指針對高所得或高資產者加徵的稅，例如每年對個人淨資產課徵的「財富稅」，或提高最高所得稅率。各國做法不同，台灣目前沒有財富稅。"
        sources:
          - kind: reference
            title: "財富稅（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/財富稅"
    background:
      text: "台灣個人綜合所得稅採5級累進，稅率由5%到40%；營利事業所得稅率為20%。"
      sources:
        - kind: official
          title: "所得稅法 第5條（全國法規資料庫）"
          url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003"
    plain:
      pro: "支持的人認為，經濟成長的好處愈來愈集中在少數資本家，受薪族卻扛著物價上漲。適度加重高所得、高資產者或大企業的稅，例如調高遺產稅，用在長照等福利，能縮小貧富差距。"
      con: "反對的人認為，各國都在降稅，台灣加企業稅會加重負擔、降低投資意願。對富人加稅也未必可行：調高最高稅率會加重高薪族，大幅調高遺贈稅易引發避稅，應改擴大稅基。"

  - question: E02
    terms:
      - term: 最低工資
        text: "法律規定雇主付給勞工的最低薪資，以前叫「基本工資」。2024年《最低工資法》施行後，由勞動部召開最低工資審議會，每年審議是否調整。"
        sources:
          - kind: official
            title: "最低工資法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030028"
    background:
      text: "2026年最低工資為月薪29,500元、時薪196元；2026年審議決定2027年起調為月薪30,900元、時薪205元，是自2016年以來連續第11年調漲。法律規定審議時應參考消費者物價指數年增率。"
      sources:
        - kind: official
          title: "最低工資（行政院）"
          url: "https://www.ey.gov.tw/Page/448DE008087A1971/f56b115b-b12c-4ccd-b15f-816c42bfb1d7"
          date: "2026-10-01"
        - kind: official
          title: "最低工資法 第9條（全國法規資料庫）"
          url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030028"
    plain:
      pro: "支持的人認為，物價年年漲，最低工資不跟著調，基層勞工的實際收入就縮水。勞資談判力量不對等，應用法律規定最低工資不得低於前一年、並反映物價漲幅，讓調整有穩定依據。"
      con: "反對的人認為，最低工資應依經濟、景氣和企業負擔彈性調整，不該用法律定公式或每年必漲。遇上關稅衝擊、成本上升，傳產和中小企業壓力大，硬漲可能傷害經營和投資意願。"

  - question: E03
    terms:
      - term: 函釋
        text: "主管機關針對法律條文該怎麼適用所作的解釋，通常以公文（函）發布。它不是法律本身，但實務上會直接影響企業申請與經營。"
        sources:
          - kind: official
            title: "行政程序法 第159條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030055"
      - term: 行政規則
        text: "依《行政程序法》，指行政機關為規範內部運作、或統一解釋法令與認定事實而訂定的一般規定。不直接對外創設人民的權利義務，但各機關實務上須遵循。"
        sources:
          - kind: official
            title: "行政程序法 第159條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030055"
    plain:
      pro: "支持的人認為，法規太多、太嚴或解釋不一，會讓企業申請流程拖長、成本變高，壓抑投資和創新。政府主動檢討過時的函釋和行政規則，讓程序透明、可預期，企業才能更有彈性。"
      con: "反對的人認為，管制是保護消費者、勞工和環境的防線。食安等事件顯示，太依賴業者自主管理易流於書面，出事才補救，代價由全民承擔。政府應落實稽查把關，而不是一味鬆綁。"

  - question: E04
    terms:
      - term: 長照
        text: "長期照顧，指對因老化、疾病或身心障礙而生活無法自理的人，提供居家、社區或住宿式的照顧服務。依《長期照顧服務法》由政府規劃，多由民間單位提供服務。"
        sources:
          - kind: official
            title: "長期照顧服務法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070040"
          - kind: official
            title: "衛福部長照專區（1966專線）"
            url: "https://1966.gov.tw/LTC/mp-207.html"
      - term: 公共托育與準公共
        text: "公共托育指政府設立或委託經營、收費較低的托嬰中心等；「準公共」則是政府與私立業者簽約，業者把收費控制在一定範圍，政府再補助送托的家長。"
        sources:
          - kind: official
            title: "強化0-2歲幼兒照顧體系 不排富全照顧 挺專業顧品質（衛生福利部）"
            url: "https://www.mohw.gov.tw/cp-16-72135-1.html"
            date: "2022-10-27"
      - term: 育兒津貼
        text: "政府直接發給家長的現金補助。例如未滿2歲的幼兒由家人自己照顧時可領取；和送托公共或準公共托育時領的托育補助，兩者不能同時領。"
        sources:
          - kind: official
            title: "強化0-2歲幼兒照顧體系 不排富全照顧 挺專業顧品質（衛生福利部）"
            url: "https://www.mohw.gov.tw/cp-16-72135-1.html"
            date: "2022-10-27"
    background:
      text: "目前0至2歲幼兒照顧採津貼與服務並行：家長自己帶可領育兒津貼，送托可領托育補助。長照則自2017年起推動「長照十年計畫2.0」，由政府特約民間單位提供服務，民眾依失能程度使用並部分負擔。"
      sources:
        - kind: official
          title: "強化0-2歲幼兒照顧體系 不排富全照顧 挺專業顧品質（衛生福利部）"
          url: "https://www.mohw.gov.tw/cp-16-72135-1.html"
          date: "2022-10-27"
        - kind: official
          title: "衛福部長照專區（1966專線）"
          url: "https://1966.gov.tw/LTC/mp-207.html"
    plain:
      pro: "支持的人認為，公共照顧就是要照顧買不起的人，要普及、價格親民；不然會變成有錢自己買、沒錢自求多福。現在少子化對策八到九成是發現金，生育率卻還在下降。"
      con: "反對的人認為，德日經驗顯示育兒津貼能有效減輕負擔，各方也都提出津貼方案。每家情況不同，有人送托、有人自己帶，津貼和托育應雙軌並行讓家長選，不必以政府提供為主。"

  - question: E05
    terms:
      - term: 中低收入戶
        text: "依《社會救助法》，家庭總收入平均分給每人後，每月不超過最低生活費的1.5倍，且家庭財產未超過一定金額，經地方政府審核認定的家庭，可獲得部分補助。"
        sources:
          - kind: official
            title: "社會救助法 第4-1條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050078"
    background:
      text: "台灣的福利兩種形式都有：例如0至2歲育兒津貼自2023年起取消排富，符合資格者都可領；低收入戶、中低收入戶的補助則須經所得與財產審查。"
      sources:
        - kind: official
          title: "強化0-2歲幼兒照顧體系 不排富全照顧 挺專業顧品質（衛生福利部）"
          url: "https://www.mohw.gov.tw/cp-16-72135-1.html"
          date: "2022-10-27"
        - kind: official
          title: "社會救助法（全國法規資料庫）"
          url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050078"
    plain:
      pro: "支持的人認為，資源有限，福利不分貧富一律發，效果被稀釋，也加重財政負擔。集中給需要的家庭，例如排除所得最高的一部分，省下的錢加倍給中低收入者，較能縮小差距。"
      con: "反對的人認為，每個孩子都很重要，家庭支持應穩定、普及、能延續，不是只給部分家庭。育兒津貼取消排富後，所有家庭都受照顧，原本被排除的上萬名幼兒也受益。"

  - question: S01
    terms:
      - term: 多元性別
        text: "泛指不同的生理性別、性別特質、性別認同與性傾向，例如同性戀、雙性戀、跨性別等，不只限於「男、女」兩種分類。"
        sources:
          - kind: official
            title: "性別平等教育法施行細則 第2條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0080068"
      - term: 性別平等教育法
        text: "2004年制定，規定學校須推動性別平等教育，國中小每學期至少實施4小時相關課程或活動。施行細則規定課程應涵蓋情感教育、性教育、性別認同及性傾向教育等。"
        sources:
          - kind: official
            title: "性別平等教育法 第18條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0080067"
          - kind: official
            title: "性別平等教育法施行細則 第13條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0080068"
      - term: 課綱
        text: "課程綱要，由教育部訂定，規定各學習階段要教哪些主題與能力，教科書與教學依此編寫。現行是2019年起實施的十二年國教課綱（俗稱108課綱）。"
        sources:
          - kind: official
            title: "十二年國教課程綱要（國家教育研究院）"
            url: "https://www.naer.edu.tw/PageSyllabus?fid=52"
    plain:
      pro: "支持的人認為，校園裡本來就有不同性傾向和性別認同的學生，也有同志家庭的孩子。教材刻意避開會讓他們覺得被忽視，也不利減少歧視。依課綱適齡介紹，能幫助學生尊重差異。"
      con: "反對的人認為，課程應符合課綱的適齡原則，小一孩子該先認識不同性別的身心差異，太早接觸同婚內容會影響對婚姻家庭的看法。也應遵守公投結果，不讓同志教育進入國中小。"

  - question: S02
    terms:
      - term: 唯一死刑
        text: "法律規定某種罪只能判死刑，法官沒有其他刑度可選。2024年憲法法庭判決，認定刑法中擄人勒贖而故意殺害被害人的唯一死刑規定違憲。"
        sources:
          - kind: news
            title: "死刑釋憲案 憲法法庭：有條件合憲（中央社）"
            url: "https://www.cna.com.tw/news/asoc/202409205006.aspx"
            date: "2024-09-20"
    background:
      text: "2024年9月憲法法庭113年憲判字第8號判決死刑「有條件合憲」：只限犯罪情節最嚴重的案件，並要求更嚴格的程序保障，例如各級法院判死須一致決、精神障礙者不得判處死刑。"
      sources:
        - kind: news
          title: "死刑釋憲案 憲法法庭：有條件合憲（中央社）"
          url: "https://www.cna.com.tw/news/asoc/202409205006.aspx"
          date: "2024-09-20"
    plain:
      pro: "支持的人認為，死刑嚇阻效果說不準，為此剝奪生命不合比例，長期關押就能保護社會。國家不該用刑罰報復，死刑反讓國家疏於找犯罪原因、照顧被害人，沒人有權結束他人生命。"
      con: "反對的人認為，對手段兇殘、罪證確鑿的重大犯罪，死刑是實現正義、回應被害人家屬的必要手段，多數民意也反對廢除。門檻嚴到幾乎判不了，等於名存實亡；應優先保護無辜者。"

  - question: S03
    terms:
      - term: 移工
        text: "從外國來台工作的勞工，多從事製造、營造、看護、漁業等基層工作。依《就業服務法》，在台工作年限有上限，一般累計不得超過12年，家庭看護符合條件者最長14年。"
        sources:
          - kind: official
            title: "就業服務法 第52條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0090001"
      - term: 中階技術人力
        text: "勞動部「移工留才久用方案」的制度，讓在台工作一定年資、符合薪資或技術條件的移工，轉任中階技術工作，不再受在台工作年限的限制。"
        sources:
          - kind: official
            title: "留才中心協助國內科技大廠 留用優質外國技術人力！（勞動部）"
            url: "https://www.mol.gov.tw/1607/1632/1633/83432/"
    background:
      text: "勞動部統計，截至2025年7月底，雇主申請聘僱外國中階技術人力共5萬5,773人，已核准5萬1,925人，其中產業類約2.1萬人、社福類約3.1萬人。"
      sources:
        - kind: official
          title: "留才中心協助國內科技大廠 留用優質外國技術人力！（勞動部）"
          url: "https://www.mol.gov.tw/1607/1632/1633/83432/"
    plain:
      pro: "支持的人認為，少子化、高齡化讓很多行業和家庭照顧缺人；資深移工技術成熟卻因年限必須回國，常被別國挖走。讓他們轉任中階人力、不限年限並可接軌永久居留，能留住熟手。"
      con: "反對的人認為，缺工時正是勞工能爭取加薪的機會，持續擴大依賴外籍人力只是幫雇主省錢，讓本國勞工難以加薪、中高齡更難找工作。缺工應靠提高薪資和勞動條件解決。"

  - question: S04
    terms:
      - term: 法官保留
        text: "指搜索、羈押、通訊監察等嚴重干預人民權利的強制處分，原則上須先經法官審查同意，例如搜索票由法官簽發，不能只由警察或檢察官自行決定。"
        sources:
          - kind: official
            title: "刑事訴訟法 第128條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0010001"
          - kind: official
            title: "通訊保障及監察法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0060044"
    plain:
      pro: "支持的人認為，詐騙、跨境和科技犯罪手法一直翻新，警察檢調缺少偵查工具和法律授權，就很難有效打擊犯罪。在法律明確授權、又有法院審查的前提下適度擴權，有助維護治安。"
      con: "反對的人認為，讓檢警用木馬程式監控通訊軟體，等於政府帶頭當駭客，恐倒退回警察國家。只要說「必要」就能定位監控，不限罪名、不經法院審查，人權隱私都會受害。"

  - question: S05
    terms:
      - term: 人工生殖法
        text: "規範試管嬰兒等人工協助生育的法律。現行規定只有被診斷不孕等情形的已婚異性夫妻可以接受，單身女性與同性伴侶目前不能在台灣依法使用。"
        sources:
          - kind: official
            title: "人工生殖法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070024"
      - term: 同性婚姻
        text: "依2019年5月施行的《司法院釋字第七四八號解釋施行法》，同性伴侶可以登記結婚，但在人工生殖等部分事項上，與異性婚姻適用的規定仍有不同。"
        sources:
          - kind: official
            title: "司法院釋字第七四八號解釋施行法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0000008"
    plain:
      pro: "支持的人認為，有父有母的婚姻家庭是孩子最穩定的成長環境，應優先鼓勵適齡結婚、生育，而非擴大單身或同性伴侶使用人工生殖。這涉及兒童權益、社會也無共識，應審慎。"
      con: "反對的人認為，現代家庭愈來愈多元，有單親、同志和單身家庭，政府應平等支持每一種家庭。讓單身女性和女同志伴侶也能使用人工生殖，是尊重生育自主，也能顧及兒童利益。"

  - question: S06
    terms:
      - term: 四維八德
        text: "傳統儒家倫理德目。四維指「禮、義、廉、恥」，八德通常指「忠、孝、仁、愛、信、義、和、平」，過去常見於校訓與公民、品德教材。"
        sources:
          - kind: reference
            title: "四維八德（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/四維八德"
      - term: 108課綱
        text: "2019年起實施的十二年國民基本教育課程綱要，以「核心素養」為主軸，也就是重視把知識、能力與態度用在生活中解決問題，而不只是記憶背誦。"
        sources:
          - kind: official
            title: "十二年國教課程綱要（國家教育研究院）"
            url: "https://www.naer.edu.tw/PageSyllabus?fid=52"
    plain:
      pro: "支持的人認為，近年課程淡化傳統經典和四維八德，學生缺少有系統的倫理教育，師生關係緊張、青少年犯罪增加。讓四維八德回到品德教育核心，能建立是非觀、兼顧權利責任。"
      con: "反對的人認為，品德不是背教條或德目就能養成，要在生活實踐和討論中培養。現行課綱沒廢除禮義廉恥，而是強調表達、溝通和思辨；教育應與時俱進，不該回到背誦德目的方式。"
