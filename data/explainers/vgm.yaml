# 名詞與背景、正反說法的白話說明（環境與能源、不計入維度題、雙北市政題）
# 規則：中立；不提政黨與政治人物名字；plain 不加入原說法以外的事實或論點。
explainers:
  - question: V01
    terms:
      - term: 再生能源
        text: "指太陽能、風力、地熱、水力、生質能等可自然補充的能源。依《再生能源發展條例》，電業須依政府公告的躉購費率，收購符合條件的再生能源電力。"
        sources:
          - kind: official
            title: "再生能源發展條例（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0130032"
      - term: 間歇性
        text: "太陽光電只能在白天發電、風力發電隨風速變化，發電量不穩定，也難以依用電需要隨時調度，因此需要儲能或其他電源配合。"
        sources:
          - kind: reference
            title: "間歇性再生能源（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/間歇性再生能源"
      - term: 淨零轉型
        text: "淨零排放指人為排放的溫室氣體，扣掉森林吸收、碳捕捉等移除量後等於零。《氣候變遷因應法》訂下2050年（民國139年）達成淨零排放的國家目標。"
        sources:
          - kind: official
            title: "氣候變遷因應法 第4條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=O0020098"
    background:
      text: "依台電資料，2025年台電系統發購電量約2,524億度，其中燃氣占五成以上，再生能源約占12.7%，核能降至1.2%。"
      sources:
        - kind: news
          title: "台灣能源政策整理：綠能布局、電網與新型能源（科技新報）"
          url: "https://technews.tw/2026/03/20/taiwan-energy-policy/"
          date: "2026-03-20"
    plain:
      pro: "支持的人認為，國際供應鏈減碳要求越來越嚴，綠電已是出口必要條件，關係訂單和競爭力，要加速發展。電價也該反映真實成本，壓低電價等於補貼化石燃料，不利節能和淨零。"
      con: "反對的人認為，再生能源貴又不穩，政府高價買綠電、又停用便宜電源，台電虧損擴大，最後靠漲電價或預算補貼由全民買單。應以穩定、平價供電優先，不宜為衝綠能讓電價續漲。"

  - question: V02
    terms:
      - term: 碳費
        text: "依《氣候變遷因應法》，對溫室氣體年排放量達2.5萬公噸二氧化碳當量以上的電力、燃氣供應業及製造業，依排放量收取的費用，每年5月底前繳交前一年的費用。"
        sources:
          - kind: official
            title: "碳費收費辦法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=O0020139"
          - kind: news
            title: "首期碳費全台工廠共繳納49.7億 半導體業占比逾4成最多（公視新聞網）"
            url: "https://news.pts.org.tw/article/811325"
            date: "2026-06-03"
      - term: 優惠費率
        text: "碳費一般費率為每公噸300元。排放大戶提出自主減量計畫並經環境部核定後，可適用較低的優惠費率：A為每公噸50元、B為每公噸100元。"
        sources:
          - kind: news
            title: "首期碳費全台工廠共繳納49.7億 半導體業占比逾4成最多（公視新聞網）"
            url: "https://news.pts.org.tw/article/811325"
            date: "2026-06-03"
    background:
      text: "碳費自2025年起依排放量計算，2026年5月底首次繳費：應繳的240家企業、461座工廠共繳約49.7億元，其中半導體業約占4成。"
      sources:
        - kind: news
          title: "首期碳費全台工廠共繳納49.7億 半導體業占比逾4成最多（公視新聞網）"
          url: "https://news.pts.org.tw/article/811325"
          date: "2026-06-03"
    plain:
      pro: "支持的人認為，碳費是讓排放者為污染付代價，費率太低、優惠太多，大企業可能繳錢了事。逐步調高碳費，收入助轉型、照顧弱勢，減碳更有效，也合乎國際先低後高做法。"
      con: "反對的人認為，台灣碳費已明顯高於日韓等競爭國實質碳價，加重製造業成本；電價工資同漲，恐削弱國際競爭力。碳費應先低後高、不高於對手，給產業時間轉型。"

  - question: V03
    terms:
      - term: 環評
        text: "環境影響評估。依《環境影響評估法》，一定類型與規模以上的開發案，須在開發前評估對環境、生態、社會與文化的影響，經審查通過後才能開發。"
        sources:
          - kind: official
            title: "環境影響評估法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=O0090001"
      - term: 環評門檻
        text: "哪些開發案必須做環評，由主管機關訂定的認定標準，依開發類型、規模，以及是否位在山坡地、水庫集水區等敏感地區來決定；未達門檻者不必實施環評。"
        sources:
          - kind: official
            title: "開發行為應實施環境影響評估細目及範圍認定標準（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=O0090012"
    plain:
      pro: "支持的人認為，大型開發一旦破壞山林、水域或地質敏感區就難復原。近年有光電案場設在山坡地、水庫等敏感地點卻免環評。擴大加嚴環評、讓結論有實質約束力，才能事前把關。"
      con: "反對的人認為，台灣光電已落後國際，加嚴環評會拖慢光電，地面型光電要多花一兩年，延後綠能和減碳。衝突根源是缺乏國土和土地規畫，不是環評不足；用面積門檻也不科學。"

  - question: V04
    terms:
      - term: 天然氣安全存量
        text: "法規規定須維持的最低能源存量，以可供應的天數計算。依經濟部說明，現行規定天然氣為11天以上，預計2027年提高到14天；石油為90天以上、煤炭為30天以上。"
        sources:
          - kind: news
            title: "經濟部：油氣煤存量均高於法規 3策略因應中東情勢變化（公視新聞網）"
            url: "https://news.pts.org.tw/article/797552"
            date: "2026-03-05"
    background:
      text: "2025年台電系統發購電量中，燃氣占五成以上、再生能源約12.7%；政府2024年設定的2030年電力結構目標為燃氣50%、再生能源30%、燃煤20%。依政府規劃，2026至2035年燃氣機組累計新增約26GW；太陽光電、離岸風電的累計目標為2035年達35GW、18.4GW（2025年底約15.5GW、3.6GW）。"
      sources:
        - kind: news
          title: "台灣能源政策整理：綠能布局、電網與新型能源（科技新報）"
          url: "https://technews.tw/2026/03/20/taiwan-energy-policy/"
          date: "2026-03-20"
        - kind: gazette
          title: "立法院第11屆第5會期經濟委員會第20次全體委員會議紀錄（經濟部書面資料「全國電力資源供需報告」）"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/115/61/LCIDC01_1156101_00001.pdf"
          date: "2026-07-08"
        - kind: gazette
          title: "立法院第11屆第2會期第6次會議紀錄 公報 行政院長「能源配比及電價政策」專案報告"
          url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/113/84/LCIDC01_1138401_00010.pdf"
          date: "2024-10-29"
    plain:
      pro: "支持的人認為，AI是台灣難得的機會，AI和半導體讓用電變多，新製程還可能再增加用電，電要趕快跟上。台灣土地小，燃氣機組占地小、蓋得快，各國快速補電都選燃氣，所以短期內新增電源應以燃氣為主，先救急。"
      con: "反對的人認為，天然氣是化石燃料，有些液化天然氣的溫室氣體排放和燃煤差不多，新設施會排碳多年。台灣能源95%靠進口，天然氣貴，極端時存量只夠約11天，靠船運是國安漏洞。再生能源才是自產能源，應加快發展。"

  - question: G01
    terms:
      - term: 延役與再運轉
        text: "核電廠運轉執照（原為40年）到期後，經安全審查換發新執照繼續運轉。2025年5月修法後，換發的執照最長20年，執照已到期的電廠也可申請再運轉。"
        sources:
          - kind: official
            title: "核子反應器設施管制法 第6條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0160019"
          - kind: news
            title: "快訊／非核家園生效前夕！立院三讀《核管法》 核三廠可續命20年（TVBS）"
            url: "https://news.tvbs.com.tw/politics/2868409"
            date: "2025-05-13"
    background:
      text: "2025年8月23日舉行「核三廠在主管機關確認無安全疑慮後繼續運轉」公投，同意票約434萬、不同意票約151萬，但同意票未達投票權人總數四分之一的門檻，未通過；投票率29.53%。"
      sources:
        - kind: news
          title: "核三重啟公投未通過 同意票催票率南投33%最高、金門11%最低【圖解】（公視新聞網）"
          url: "https://news.pts.org.tw/article/767088"
          date: "2025-08-23"
    plain:
      pro: "支持的人認為，核電穩定、低碳又便宜。面對AI帶動的用電成長和淨零目標，延役或重啟核電廠能分散風險、減少火力碳排和空污、減輕電價壓力；許多國家也重新重視核能。"
      con: "反對的人認為，台灣地震多、人口密，核三廠靠近斷層，老舊機組出過輻射外洩、火災等事故，安全和成本都不確定。核廢料沒有最終處置場，不該留給下一代；應改投資再生能源。"

  - question: G02
    terms:
      - term: 調查權
        text: "國會為了立法或監督，要求政府機關或相關人員提供文件、說明事實的權力。大法官釋字第585號（2004年）認定立法院為行使職權，享有一定的調查權。"
        sources:
          - kind: official
            title: "釋字第585號解釋（憲法法庭）"
            url: "https://cons.judicial.gov.tw/docdata.aspx?fid=100&id=310766"
            date: "2004-12-15"
      - term: 聽證權
        text: "國會舉行公開會議，邀請或要求政府官員、專家學者及相關人員到場陳述意見、回答問題，作為立法或監督的參考。"
        sources:
          - kind: official
            title: "立法院職權行使法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0020058"
      - term: 藐視國會罪
        text: "2024年修法在《刑法》增訂第141條之1，處罰公務員在國會聽證或接受質詢時虛偽陳述。同年憲法法庭判決此規定違憲，立即失效。"
        sources:
          - kind: official
            title: "憲法法庭113年憲判字第9號判決摘要（司法院）"
            url: "https://www.judicial.gov.tw/tw/cp-1887-1187874-5cd85-1.html"
            date: "2024-10-25"
    background:
      text: "2024年5月立法院通過《立法院職權行使法》等修正，擴大國會調查、聽證等權限。同年10月25日憲法法庭113年憲判字第9號判決，其中多項規定違憲失效，也有部分規定合憲。"
      sources:
        - kind: official
          title: "憲法法庭113年憲判字第9號判決摘要（司法院）"
          url: "https://www.judicial.gov.tw/tw/cp-1887-1187874-5cd85-1.html"
          date: "2024-10-25"
    plain:
      pro: "支持的人認為，英美德日的國會都有調查制度，釋字第585號也肯定立法院有調查權，台灣卻只能調閱。這次修法建立聽證調查、追究在國會說謊的官員，能查清弊案、還原真相。"
      con: "反對的人認為，這是假改革、真擴權，立法院可把人移送法院，像自己當檢察官；一般人民被叫到國會詢問壓力很大，侵害人權和權力分立。憲法法庭後來也判決法案大部分違憲。"

  - question: M07
    terms:
      - term: 山坡地
        text: "依《山坡地保育利用條例》，指標高100公尺以上，或標高未滿100公尺但平均坡度在5%以上，並經公告劃定的土地；開發利用須做好水土保持。"
        sources:
          - kind: official
            title: "山坡地保育利用條例 第3條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=M0110006"
      - term: 保護區
        text: "依《都市計畫法》，都市計畫中為保護地形、自然環境或安全需要而設置的分區，會限制建築使用，原則上不能像住宅區一樣開發。"
        sources:
          - kind: official
            title: "都市計畫法 第33條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070001"
      - term: 保變住
        text: "「保護區變更為住宅區」的簡稱。台北市約50年前把25處保護區變更為住宅區，但多處始終沒有完成開發；2026年市府提出把其中19處回復為保護區。"
        sources:
          - kind: news
            title: "北市19「保變住」政策翻轉 將回復為保護區（聯合新聞網）"
            url: "https://udn.com/news/story/7314/9665171"
            date: "2026-08"
    plain:
      pro: "支持的人認為，有些地主等開發等了很多年，政府突然把土地改回保護區，地價下跌又沒補償，應依信賴保護原則保留開發可能。也有居民覺得房子不夠住，放寬開發地方才會進步。"
      con: "反對的人認為，山坡地脆弱敏感，極端降雨增加，放寬開發會提高坍方風險，危及安全與景觀。台北人口已負成長，不必再往山坡地擴張，市府也已規劃「保變住」回復保護區。"

  - question: M08
    terms:
      - term: 雙城論壇
        text: "台北市與上海市自2010年起每年輪流主辦的城市交流論壇，雙方就交通、環保、科技等市政議題交流，並簽署合作備忘錄。2020至2022年曾因疫情改為線上舉行。"
        sources:
          - kind: reference
            title: "臺北上海城市論壇（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/雙城論壇"
    background:
      text: "2025年12月論壇在上海舉行，兩市簽署水治理、職業技能培訓2項備忘錄。自2010年起，雙方累計簽署49項交流合作備忘錄。"
      sources:
        - kind: news
          title: "雙城論壇 簽2項合作備忘錄（工商時報）"
          url: "https://www.ctee.com.tw/news/20251229700112-430802"
          date: "2025-12-29"
    plain:
      pro: "支持的人認為，雙城論壇是兩岸至今唯一的官方對話平台，兩市可就科技、水治理、職業培訓等交流、簽備忘錄。接觸比牴觸好、對話比對抗好，持續交流能增進了解、走向和平。"
      con: "反對的人認為，辦了這麼多年，上海方出席的人常常層級不對等，說好的互相尊重、了解沒有實現，中國軍機擾台也沒減少。論壇對市政效益很低，沒效益的事就不必再辦。"

  - question: M09
    terms: []
    background:
      text: "雙北自2019年5月1日起實施垃圾袋互收，貼有任一市防偽標籤的專用垃圾袋，在兩市都可以使用。"
      sources:
        - kind: news
          title: "雙北市垃圾袋互收 敲定5月1日起實施（新頭殼）"
          url: "https://newtalk.tw/news/view/2019-04-23/236915"
          date: "2019-04-23"
    plain:
      pro: "支持的人認為，雙北本來就是同一個生活圈，交通、捷運、河川、垃圾都要兩市一起管，道路、捷運施工和河川整治也都跨兩市。兩市共治才能共榮，讓雙北變成30分鐘生活圈。"
      con: "反對的人認為，雙北能合作很好，但城市間也要競爭，像兩家餐廳各有特色菜，市民才有選擇，不能失去主體性。食安、勞安守住共同標準、互相合作即可，「共好」和共治不同。"

  - question: M10
    terms:
      - term: 參與式預算
        text: "由居民直接提案、討論並投票，決定一部分公共預算用途的制度。台灣自2015年前後引進，台北市即以住民提案、討論與票選，決定部分預算用途。"
        sources:
          - kind: reference
            title: "參與式預算（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/參與式預算"
    plain:
      pro: "支持的人認為，參與式預算讓市民從提案、討論到投票，實際參與分配公共資源，能喚起公民意識、關心社區，市府也能從市民角度解決問題，提升施政品質和滿意度，深化民主。"
      con: "反對的人認為，參與式預算每年花不少錢和人力，成效有限，有些提案流於形式或成案後喊卡，也缺專責監督。議員也質疑它衝擊代議政治，預算該由議會把關，擴大恐權責不清。"
