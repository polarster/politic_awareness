# 名詞與背景、正反說法的白話說明（兩岸與國家認同、國防與外交）
# 規則：中立；不提政黨與政治人物名字；plain 不加入原說法以外的事實或論點。
explainers:
  - question: N01
    terms:
      - term: 九二共識
        text: "這個名稱是2000年由當時的陸委會主委提出，用來概括1992年兩岸兩會在香港的會談結果。一方理解為「一中各表」；對岸近年定義為「兩岸同屬一中、共謀統一」；也有人認為當年並無共識。"
        sources:
          - kind: news
            title: "不只九二共識 兩岸喊話這些名詞你都知道嗎（中央社）"
            url: "https://www.cna.com.tw/news/firstnews/201901025006.aspx"
            date: "2019-01-02"
          - kind: reference
            title: "九二共識（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/九二共識"
      - term: 兩會
        text: "指台灣的海峽交流基金會（海基會）與中國的海峽兩岸關係協會（海協會）。兩岸政府不直接往來時，由這兩個受政府委託的機構負責聯繫與協商。"
        sources:
          - kind: official
            title: "財團法人海峽交流基金會"
            url: "https://www.sef.org.tw/"
      - term: 一國兩制
        text: "中國提出的統一方案：統一後只有一個國家，但原有的社會、經濟制度可在一段期間內維持不變，香港、澳門即採用此制度。台灣官方長期表示不接受。"
        sources:
          - kind: news
            title: "不只九二共識 兩岸喊話這些名詞你都知道嗎（中央社）"
            url: "https://www.cna.com.tw/news/firstnews/201901025006.aspx"
            date: "2019-01-02"
          - kind: reference
            title: "一國兩制（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/一國兩制"
    background:
      text: "兩岸兩會自1990年代起協商事務性議題，2008至2016年間簽署多項協議，包括2010年的《海峽兩岸經濟合作架構協議》（ECFA）與2013年的服務貿易協議。2016年後兩會的制度化協商中斷，至今未恢復。"
      sources:
        - kind: official
          title: "聽取「兩岸兩會第九次高層會談成果說明」報告（行政院）"
          url: "https://www.ey.gov.tw/Page/9277F759E41CCD91/2e140085-f195-41eb-b0a6-bda3dec6c858"
          date: "2013-06-27"
        - kind: reference
          title: "海峽兩岸經濟合作架構協議（維基百科）"
          url: "https://zh.wikipedia.org/zh-tw/海峽兩岸經濟合作架構協議"
    plain:
      pro: "支持的人認為，2008年起的八年間，兩岸靠九二共識對話交流、維持和平。2016年後對岸以此為由停止兩會對話；政府若接受九二共識，兩岸就能重新對話、避免衝突。"
      con: "反對的人認為，對岸把九二共識說成「兩岸同屬一中、共同追求統一」，還和一國兩制綁在一起，接受它等於先在主權上讓步。多數民意也不接受，對話應該對等、不設政治前提。"

  - question: N02
    terms:
      - term: 互不隸屬
        text: "指中華民國（台灣）與中華人民共和國之間沒有上下從屬關係，誰也不管轄誰。支持者認為這只是描述現狀；批評者認為容易被解讀成「國與國」的關係。"
        sources:
          - kind: news
            title: "陸委會：對岸惡意扭曲國慶演說 互不隸屬是現狀（中央社）"
            url: "https://www.cna.com.tw/news/acn/202410160357.aspx"
            date: "2024-10-16"
      - term: 主權互不承認、治權互不否認
        text: "一種描述兩岸關係的說法：雙方不承認對方的主權主張，但也不否認對方實際治理各自地區的事實，用來避免把兩岸定位成國與國的關係。"
        sources:
          - kind: reference
            title: "兩岸互不承認主權，互不否認治權（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/互不承認主權、互不否認治權"
      - term: 兩國論
        text: "指1999年當時的總統提出的「特殊的國與國關係」，主張兩岸是兩個國家之間的特殊關係。中國強烈反對，之後常被用來泛指把兩岸定位為國與國的主張。"
        sources:
          - kind: news
            title: "不只九二共識 兩岸喊話這些名詞你都知道嗎（中央社）"
            url: "https://www.cna.com.tw/news/firstnews/201901025006.aspx"
            date: "2019-01-02"
          - kind: reference
            title: "特殊的國與國關係（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/兩國論"
      - term: 兩岸人民關係條例
        text: "全名《臺灣地區與大陸地區人民關係條例》，1992年制定，規範台灣與中國大陸人民的往來、身分、投資等事務，法條中以「臺灣地區」「大陸地區」稱呼兩岸。"
        sources:
          - kind: official
            title: "臺灣地區與大陸地區人民關係條例（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010001"
    background:
      text: "中華民國政府目前實際治理台澎金馬，中華人民共和國治理中國大陸。中華民國憲法增修條文以「自由地區」與「大陸地區」區分兩岸，兩岸人民關係條例也依循這個架構。"
      sources:
        - kind: official
          title: "中華民國憲法增修條文（全國法規資料庫）"
          url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0000002"
        - kind: official
          title: "臺灣地區與大陸地區人民關係條例（全國法規資料庫）"
          url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010001"
    plain:
      pro: "支持的人認為，台灣有人民、土地、政府、主權和自己的護照，關稅也自己跟美國談，對岸從沒統治過台灣。台灣已是主權獨立國家，對岸當然是外國，否則等於承認台灣屬於中國。"
      con: "反對的人認為，依憲法和兩岸人民關係條例，兩岸是國家統一前的特殊關係，同屬一中，大陸不是外國，用「主權互不承認、治權互不否認」較貼切。說成國與國會製造事端。"

  - question: N03
    terms:
      - term: 憲法增修條文
        text: "1991年起陸續制定、附加在中華民國憲法之後的條文。前言寫明是「為因應國家統一前之需要」而制定，並把適用範圍分為「自由地區」與「大陸地區」。"
        sources:
          - kind: official
            title: "中華民國憲法增修條文（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0000002"
    background:
      text: "政大選舉研究中心長期調查，2026年6月的結果為：永遠維持現狀34.4%、維持現狀再決定25.5%、維持現狀偏向獨立21.7%、維持現狀偏向統一約6%、儘快獨立4.5%、儘快統一1.3%。"
      sources:
        - kind: reference
          title: "臺灣民眾統獨立場趨勢分佈（1994～2026.06）（政大選舉研究中心）"
          url: "https://esc.nccu.edu.tw/PageDoc/Detail?fid=7804&id=6962"
          date: "2026-06"
    plain:
      pro: "支持的人認為，憲法增修條文仍以「國家統一前」為前提，兩岸語言文化相近。用和平交流、談判慢慢走向統一，能從根本降低戰爭風險，台灣也該主動去談、爭取好條件。"
      con: "反對的人認為，大多數人反對統一、不接受一國兩制，民主才是台灣最大的共識，前途只有2300萬人能決定。應守住民主自由的現狀和生活方式，而不是走向和中國統一。"

  - question: N04
    terms:
      - term: ECFA
        text: "《海峽兩岸經濟合作架構協議》，2010年簽署生效的兩岸經貿框架協議，先以「早期收穫清單」讓部分貨品降稅，並約定之後再談服務貿易、貨品貿易等協議。"
        sources:
          - kind: reference
            title: "海峽兩岸經濟合作架構協議（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/海峽兩岸經濟合作架構協議"
      - term: 服貿協議
        text: "《海峽兩岸服務貿易協議》，2013年簽署，約定雙方互相開放部分服務業市場。2014年立法院審查過程引發大規模抗議，至今未完成審議，沒有生效。"
        sources:
          - kind: official
            title: "聽取「兩岸兩會第九次高層會談成果說明」報告（行政院）"
            url: "https://www.ey.gov.tw/Page/9277F759E41CCD91/2e140085-f195-41eb-b0a6-bda3dec6c858"
            date: "2013-06-27"
          - kind: reference
            title: "海峽兩岸服務貿易協議（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/海峽兩岸服務貿易協議"
      - term: 貨貿協議
        text: "ECFA後續要談的「貨品貿易協議」，目的是擴大雙方調降或取消關稅的貨品範圍。兩岸曾多次協商，但沒有完成簽署。"
        sources:
          - kind: reference
            title: "海峽兩岸經濟合作架構協議（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/海峽兩岸經濟合作架構協議"
    background:
      text: "依財政部統計，2025年台灣出口6,407.5億美元，其中輸往中國大陸及香港占26.6%、輸往美國占30.9%，是26年來對美出口比重首次高於中港。"
      sources:
        - kind: news
          title: "財部：2025 年對美出口比重 30.9%，26 年首見高於中港（科技新報）"
          url: "https://technews.tw/?p=1496641"
          date: "2026-01-09"
    plain:
      pro: "支持的人認為，中國大陸市場太重要，不能放棄；應快談ECFA、重啟服貿和貨貿、保障台商，多開放陸客。近年往來降溫，陸客不來，老街和觀光業受創，恢復往來有助地方。"
      con: "反對的人認為，中國常把經貿當施壓和統戰工具，用優惠吸引台灣企業、人才和資金，讓台灣更依賴單一市場，被經濟脅迫時風險很高。不如分散市場，多和其他國家合作。"

  - question: D01
    terms:
      - term: GDP
        text: "國內生產毛額，指一個國家一年內生產的所有最終商品與服務的總價值，常用來衡量經濟規模。「國防預算占GDP幾%」就是拿國防支出和這個總值相比。"
        sources:
          - kind: reference
            title: "國內生產毛額（維基百科）"
            url: "https://zh.wikipedia.org/zh-tw/國內生產毛額"
      - term: 特別預算
        text: "在每年的總預算之外，針對國防緊急設施、重大災害等特定需求，另外依《預算法》或特別條例編列的預算。近年部分武器採購即以特別預算編列。"
        sources:
          - kind: official
            title: "預算法 第83條（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=T0020001"
    background:
      text: "行政院2025年8月提出的2026年度預算，國防相關經費合計9,495億元，約占GDP 3.32%。這個數字採北約計算標準，除國防部預算外，也包含特別預算、海巡及退除役官兵退休給付等。政府並宣示2030年前要達到GDP 5%。"
      sources:
        - kind: news
          title: "明年總預算案挹注地方增4165億 國防經費9495億創新高（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202508210204.aspx"
          date: "2025-08-21"
        - kind: news
          title: "國慶演說 總統：民主台灣是2300萬人在世界最明確定位【全文】（中央社）"
          url: "https://www.cna.com.tw/news/aipl/202510100066.aspx"
          date: "2025-10-10"
    plain:
      pro: "支持的人認為，中國威脅越來越大、演習不斷，周邊國家都在加預算，台灣也不例外。2030年前達GDP 5%，能表現守國決心、和各國共同嚇阻；投資國防就是投資和平。"
      con: "反對的人認為，台灣需要合理國防，但預算太高超出財政能力，台灣不是提款機，不該陷入軍備競賽。短時間把國防衝到GDP 5%，配套恐怕跟不上，也會排擠民生和社福預算。"

  - question: D02
    terms:
      - term: 義務役
        text: "依《兵役法》，符合年齡的男性國民必須服的兵役。2024年起，2005年以後出生的役男恢復服1年常備兵役；1994至2004年出生者原則上服4個月軍事訓練役。"
        sources:
          - kind: official
            title: "兵役法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=F0040001"
          - kind: news
            title: "義務役2024年起恢復為1年薪資2.6萬 總統：困難決定但無可迴避【全文】（中央社）"
            url: "https://www.cna.com.tw/news/aipl/202212275006.aspx"
            date: "2022-12-27"
      - term: 志願役
        text: "自願加入軍隊、以軍人為職業的官兵，依契約服役多年並領取薪資；和依法律強制徵集、服役期間較短的義務役不同。"
        sources:
          - kind: official
            title: "兵役法（全國法規資料庫）"
            url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=F0040001"
    plain:
      pro: "支持的人認為，以前4個月的訓練太短，練不出合格戰力；恢復一年役期能加強實戰射擊和戰鬥訓練，讓義務役負責守備、補足兵力。中國威脅升高下，這能提升防衛和嚇阻力。"
      con: "反對的人認為，現代戰爭靠科技和知識，兵要少而精；台灣是島嶼，人多不像陸地作戰那麼重要。延長當兵是放棄志願兵路線、走回大量徵兵的舊路，還可能引發軍備競賽、升高衝突風險。"

  - question: D03
    terms: []
    background:
      text: "台灣與美國、日本都沒有正式邦交，也沒有共同防禦條約。美國依1979年的《台灣關係法》，以提供防禦性武器等方式維持與台灣的安全關係。"
      sources:
        - kind: reference
          title: "臺灣關係法（維基百科）"
          url: "https://zh.wikipedia.org/zh-tw/臺灣關係法"
    plain:
      pro: "支持的人認為，中國軍事擴張也威脅日本、菲律賓等鄰國，日本已視之為最大戰略挑戰。台美日有共同的安全利益和民主價值，優先加深安全合作，能提高嚇阻力、維護區域和平。"
      con: "反對的人認為，國際上只有利益沒有永遠的朋友；美國以自身利益優先，今天友善、明天可能在和中國談判時拿台灣當籌碼。台灣要先準備好，不能把大國的友好當成理所當然。"

  - question: D04
    terms:
      - term: 一個中國原則
        text: "中國的官方立場：世界上只有一個中國，台灣是中國的一部分，中華人民共和國政府是代表中國的唯一合法政府。台灣方面對「一個中國」的意涵則有不同主張。"
        sources:
          - kind: news
            title: "不只九二共識 兩岸喊話這些名詞你都知道嗎（中央社）"
            url: "https://www.cna.com.tw/news/firstnews/201901025006.aspx"
            date: "2019-01-02"
      - term: 陸委會、海基會
        text: "陸委會（大陸委員會）是行政院負責兩岸政策的機關；海基會（海峽交流基金會）是受政府委託、和對岸海協會聯繫與協商的民間團體。"
        sources:
          - kind: official
            title: "財團法人海峽交流基金會"
            url: "https://www.sef.org.tw/"
    plain:
      pro: "支持的人認為，兩岸官方多年沒對話，誤判和擦槍走火風險變高。與其堅持說法讓溝通停擺，不如在用詞上保留彈性，先恢復正式對話，處理人身安全、觀光等問題，降低戰爭風險。"
      con: "反對的人認為，對岸恢復對話的前提是接受「一個中國原則」，等於要台灣先承認自己的國家不存在；主權讓步未必換得到和平。台灣願意對等、不設前提對話，但不該拿主權交換。"

  - question: D05
    terms: []
    plain:
      pro: "支持的人認為，美中對抗已經成形，台灣不該變成大國競爭的棋子或戰場。台灣的價值是在美中之間當理解、溝通與合作的橋梁，而不是選邊站；美中和平共處，對台灣也有利。"
      con: "反對的人認為，威脅台海和平的是中國的軍事壓力，不是台灣的選擇；美國和理念相近國家是重要夥伴，美中關係穩定與台美關係良好不衝突。台灣屬民主一方，應與民主夥伴合作。"
