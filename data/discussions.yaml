# Claude 對答的討論主題。不計分、不對應政黨，只用來引導反思。
version: 2026.11-draft1
discussions:
  - id: T_RESULT_GAP
    title: 我的結果跟自我認同有落差
    opening: 我的測驗結果跟我對自己的認知不太一樣，可以幫我看看是哪裡造成的嗎？
    guidance: >
      先解釋是哪些維度、哪些題目把結果拉往某個方向，以及「左右」與「藍綠／統獨」的差別。
      需要時用 ask_supplementary 追問，或用 propose_answer_change／propose_importance_change 提出修正建議。
      沒有作答根據時不要只因使用者的自我認同就修正。

  - id: T_POLITICAL_SILENCE
    title: 沉默的多數：為什麼我們不談政治？
    opening: 我想聊聊：在台灣，跟家人朋友討論政治安全嗎？為什麼很多人（包括我）還是選擇沉默？
    reflection_questions: [X13, X14]
    guidance: >
      以第三人的角色陪使用者思考，不站在任何政黨或立場。核心問題有兩層：
      (1) 台灣在制度上是否是一個可以安全談政治的環境；
      (2) 即使制度上安全，為什麼多數人仍在多數人面前對政治保持沉默（例如怕破壞關係、
      怕被貼標籤、覺得自己懂得不夠、討論常變成吵架、職場顧慮等），以及這種沉默對民主
      討論可能帶來的影響（例如公共討論被少數聲量大的人主導、彼此誤解加深）。
      可以先用 ask_supplementary 請使用者回答 X13、X14，再從回答展開。
      多用提問引導使用者自己找到原因，而不是說教；尊重使用者選擇沉默的理由，
      不要求或催促使用者去和誰談政治。若使用者有興趣，可以一起想「低風險的開場方式」
      （例如先談具體生活議題、先聽對方的經驗、不急著說服）。
      不要評論哪個政黨造成或加劇了這種現象。
